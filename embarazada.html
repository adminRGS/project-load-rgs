<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fingí estar embarazada - Rose Garden Scan</title>
    <style>
        body { 
            margin: 0; padding: 0; 
            background: radial-gradient(circle at center, #1a0a1a 0%, #050505 100%); 
            color: white; font-family: 'serif'; 
            display: flex; flex-direction: column; align-items: center; 
            overflow-x: hidden; min-height: 100vh; 
        }
        
        body::after {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(circle, #fff 1px, transparent 1px), radial-gradient(circle, #fff 1.5px, transparent 1.5px);
            background-size: 80px 80px, 150px 150px; opacity: 0.2; animation: moveStars 30s linear infinite; pointer-events: none; z-index: 1;
        }

        @keyframes moveStars { from { transform: translateY(0); } to { transform: translateY(-150px); } }

        .contenedor-regreso { width: 100%; padding: 20px; display: flex; justify-content: flex-start; box-sizing: border-box; z-index: 10; }
        .btn-catalogo { 
            text-decoration: none; color: #ff66b2; border: 2px solid #ff66b2; padding: 10px 22px; 
            border-radius: 30px; font-weight: bold; font-size: 0.95rem; transition: 0.3s; display: flex; align-items: center; gap: 10px; 
            background: rgba(255, 102, 178, 0.1); backdrop-filter: blur(8px); box-shadow: 0 4px 15px rgba(255, 102, 178, 0.2);
        }
        .btn-catalogo:hover { background: #ff66b2; color: white; transform: scale(1.05); }

        header { padding: 15px; text-align: center; z-index: 10; }
        h1 { font-size: 2.2rem; background: linear-gradient(90deg, #ff66b2, #ffd700, #ff66b2); background-size: 200% auto; -webkit-background-clip: text; color: transparent; animation: shineText 4s linear infinite; margin: 10px 0; }
        @keyframes shineText { to { background-position: 200% center; } }

        /* GRID DINÁMICO AUTOMÁTICO */
        .grid-caps { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(85px, 1fr)); 
            gap: 15px; width: 92%; max-width: 500px; padding-bottom: 60px; margin-top: 25px; z-index: 10;
        }
        .cap-btn-dinamico { 
            border: 1px solid #ff66b2; color: white; background: rgba(255, 102, 178, 0.15); 
            text-align: center; padding: 20px 0; border-radius: 15px; font-weight: bold; transition: 0.4s ease; cursor: pointer; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        .cap-btn-dinamico:hover { transform: translateY(-5px); box-shadow: 0 0 20px rgba(255, 102, 178, 0.6); background: rgba(255, 102, 178, 0.3); }

        #lector { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 100; overflow-y: scroll; }
        #contenido-imagenes img { width: 100%; display: block; margin-bottom: -1px; }
        
        .nav-lector { 
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); 
            display: flex; align-items: center; gap: 12px; background: rgba(0, 0, 0, 0.96); 
            padding: 10px 20px; border-radius: 45px; border: 1.5px solid #ff66b2; backdrop-filter: blur(12px); z-index: 102; 
            box-shadow: 0 0 35px rgba(255, 102, 178, 0.5); 
        }

        .grupo-navegacion { display: flex; gap: 8px; }
        .nav-btn { background: #ff66b2; color: white; border: none; padding: 10px 18px; border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 0.85rem; }
        .nav-btn:disabled { background: #333; opacity: 0.4; }
        .btn-cerrar { background: #ff4d4d; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; border: none; color: white; cursor: pointer; }

        .btn-votar-pink { position: relative; background: rgba(255, 102, 178, 0.2); border: 1.5px solid #ff66b2; width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.3s; }
        .thumb-pink { font-size: 1.4rem; filter: sepia(1) saturate(5) hue-rotate(285deg); } 

        .pop-stats {
            display: none; position: absolute; bottom: 65px; left: 50%; transform: translateX(-50%);
            background: rgba(10, 10, 10, 0.98); border: 1.5px solid #ff66b2; padding: 12px 20px; border-radius: 40px; gap: 20px; z-index: 110;
            box-shadow: 0 0 25px rgba(255, 102, 178, 0.7);
        }
        .pop-stats.active { display: flex; animation: bounceIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes bounceIn { from { opacity: 0; transform: translate(-50%, 20px) scale(0.8); } to { opacity: 1; transform: translate(-50%, 0) scale(1); } }

        .stat-btn { display: flex; align-items: center; gap: 6px; cursor: pointer; transition: 0.2s; }
        .pink-fx { filter: sepia(1) saturate(5) hue-rotate(285deg); }
        .num { font-size: 0.9rem; font-weight: bold; color: #ffcce6; }
    </style>
</head>
<body>

    <div class="contenedor-regreso">
        <a href="historias.html" class="btn-catalogo">🏠 Volver a Historias</a>
    </div>

    <header>
        <h1>Fingí estar embarazada...</h1>
    </header>

    <div id="lector">
        <div class="nav-lector">
            <div class="grupo-navegacion">
                <button id="btn-ant" class="nav-btn">← Ant.</button>
                <button id="btn-sig" class="nav-btn">Sig. →</button>
            </div>
            
            <button class="btn-cerrar" onclick="cerrarLector()">✕</button>

            <div class="btn-votar-pink" onclick="toggleStats(event)">
                <span class="thumb-pink">👍</span>
                <div class="pop-stats" id="menu-stats">
                    <div class="stat-btn" onclick="votar('loves', event)">
                        <span class="pink-fx">❤️</span>
                        <span id="val-loves" class="num">0</span>
                    </div>
                    <div class="stat-btn" onclick="votar('likes', event)">
                        <span class="pink-fx">👍</span>
                        <span id="val-likes" class="num">0</span>
                    </div>
                    <div class="stat-btn" onclick="votar('haha', event)">
                        <span>😂</span>
                        <span id="val-haha" class="num">0</span>
                    </div>
                </div>
            </div>
        </div>
        <div id="contenido-imagenes"></div>
    </div>

    <div class="grid-caps" id="grid"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, getDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBvTN_fjSZgGcEaraGeWSrnyUci_gsJ9cs",
        authDomain: "prgs-f2ef8.firebaseapp.com",
        projectId: "prgs-f2ef8",
        storageBucket: "prgs-f2ef8.firebasestorage.app",
        messagingSenderId: "639472415083",
        appId: "1:639472415083:web:2940245a8a70ed6c88dc2e"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const historiaID = "embarazada"; 
    let capsOrdenados = [];
    let idCapActual = "";

    function arreglarLink(url) {
        if (url.includes('drive.google.com')) {
            let id = url.includes('id=') ? url.split('id=')[1].split('&')[0] : url.split('/d/')[1].split('/')[0];
            return `https://lh3.googleusercontent.com/d/${id}`;
        }
        return url;
    }

    // CARGA AUTOMÁTICA DE BOTONES
    async function cargarBotonesDinamicos() {
        const grid = document.getElementById('grid');
        grid.innerHTML = "<p style='grid-column: 1/-1; text-align:center;'>Buscando capítulos...</p>";
        
        try {
            const querySnapshot = await getDocs(collection(db, historiaID));
            let disponibles = [];
            querySnapshot.forEach((docSnap) => {
                disponibles.push(docSnap.id.replace("capitulo_", ""));
            });

            capsOrdenados = disponibles.sort((a, b) => parseFloat(a) - parseFloat(b));
            grid.innerHTML = ""; 

            capsOrdenados.forEach(id => {
                const btn = document.createElement('div');
                btn.className = 'cap-btn-dinamico';
                btn.innerText = id;
                btn.onclick = () => abrirLector(id);
                grid.appendChild(btn);
            });

            if (capsOrdenados.length === 0) grid.innerHTML = "<p style='grid-column: 1/-1; text-align:center;'>Próximamente...</p>";

        } catch (e) { console.error(e); }
    }

    window.abrirLector = async function(idCap) {
        idCapActual = idCap;
        const lector = document.getElementById('lector');
        const contenedor = document.getElementById('contenido-imagenes');
        lector.style.display = 'block'; 
        lector.scrollTop = 0;
        contenedor.innerHTML = "<p style='text-align:center; padding-top:100px;'>Cargando capítulo " + idCap + "...</p>";

        const idx = capsOrdenados.indexOf(idCap.toString());
        document.getElementById('btn-ant').onclick = () => abrirLector(capsOrdenados[idx - 1]);
        document.getElementById('btn-sig').onclick = () => abrirLector(capsOrdenados[idx + 1]);
        document.getElementById('btn-ant').disabled = (idx <= 0);
        document.getElementById('btn-sig').disabled = (idx >= capsOrdenados.length - 1);

        const snap = await getDoc(doc(db, historiaID, "capitulo_" + idCap));
        if (snap.exists()) {
            const data = snap.data();
            document.getElementById('val-loves').innerText = data.loves || 0;
            document.getElementById('val-likes').innerText = data.likes || 0;
            document.getElementById('val-haha').innerText = data.haha || 0;
            
            contenedor.innerHTML = "";
            let imgs = Array.isArray(data.imagenes) ? data.imagenes : [data.link];
            imgs.forEach(url => {
                const img = document.createElement('img');
                img.src = arreglarLink(url.trim());
                contenedor.appendChild(img);
            });
        }
    }

    window.votar = async (tipo, e) => {
        e.stopPropagation();
        const docRef = doc(db, historiaID, "capitulo_" + idCapActual);
        await updateDoc(docRef, { [tipo]: increment(1) });
        const el = document.getElementById('val-' + tipo);
        el.innerText = parseInt(el.innerText) + 1;
    }

    window.toggleStats = (e) => {
        e.stopPropagation();
        document.getElementById('menu-stats').classList.toggle('active');
    }

    window.cerrarLector = () => { document.getElementById('lector').style.display = 'none'; };
    document.addEventListener('click', () => document.getElementById('menu-stats').classList.remove('active'));
    
    // Iniciar carga
    cargarBotonesDinamicos();
</script>
</body>
</html>
