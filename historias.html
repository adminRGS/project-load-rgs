<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historias - Rose Garden Scan</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <link rel="stylesheet" href="estilos-rose.css">
    
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            background: var(--fondo-rose, radial-gradient(circle at center, #1a0a1a 0%, #050505 100%)); 
            color: var(--texto-rose, white); 
            font-family: 'serif'; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh; 
            transition: background 0.3s ease, color 0.3s ease;
        }
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: radial-gradient(white 1px, transparent 1px);
            background-size: 50px 50px;
            opacity: 0.1;
            z-index: -1;
        }
        
        header {
            padding: 60px 20px 20px 20px;
            text-align: center;
            position: relative;
            width: 100%;
            max-width: 1000px;
        }
        
        .btn-inicio {
            position: absolute;
            top: 20px; left: 20px;
            text-decoration: none;
            color: #ff66b2;
            font-weight: bold;
            font-size: 0.8rem;
            text-transform: uppercase;
            border: 1px solid #ff66b2;
            padding: 8px 15px;
            border-radius: 20px;
            transition: 0.3s;
            z-index: 10;
            background: transparent;
        }
        .btn-inicio:hover { background: #ff66b2; color: white; box-shadow: 0 0 10px #ff66b2; }

        .frase-biblioteca { 
            font-style: italic;
            font-size: 1.8rem;
            background: linear-gradient(90deg, #ff66b2, #ffd700, #ff66b2);
            background-size: 200% auto;
            -webkit-background-clip: text;
            color: transparent;
            animation: shine 3s linear infinite;
            margin: 20px 0;
            font-family: 'Georgia', serif;
        }
        @keyframes shine { to { background-position: 200% center; } }

        .seccion-titulo {
            width: 90%;
            max-width: 1000px;
            margin: 30px 0 15px 0;
            font-size: 1.2rem;
            border-left: 4px solid #ff66b2;
            padding-left: 15px;
            color: #ff66b2;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
        }

        .grid-historias {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
            width: 95%;
            max-width: 1000px;
            padding: 10px 10px 40px 10px;
        }
        
        .card { 
            background: var(--panel-rose, #161616); 
            border-radius: 10px; 
            overflow: hidden; 
            transition: 0.3s; 
            text-decoration: none; 
            color: inherit; 
            text-align: center; 
            display: flex; 
            flex-direction: column; 
            position: relative; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); 
            border: 1px solid var(--borde-tarjeta, rgba(255, 102, 178, 0.2));
        }
        .card:hover { transform: translateY(-5px); box-shadow: 0 0 20px rgba(255, 102, 178, 0.4); }
        
        .estado-tag {
            position: absolute;
            top: 8px; left: 8px;
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 0.65rem;
            font-weight: bold;
            text-transform: uppercase;
            z-index: 2;
            letter-spacing: 1px;
        }
        .tag-emision    { background: #4caf50; color: white; } 
        .tag-finalizado { background: #ff66b2; color: white; }
        .tag-hiatus     { background: #ffd700; color: black; }

        .portada { width: 100%; height: 240px; object-fit: cover; background: #222; }
        
        .info { 
            padding: 15px 8px; 
            font-size: 0.85rem; 
            font-weight: bold; 
            flex-grow: 1; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            line-height: 1.3; 
            background: var(--fondo-info, transparent); 
            border-top: 1px solid var(--linea-caja, rgba(255, 255, 255, 0.05));
        }

        .sub-menu-colores {
            display: none;
            position: absolute;
            bottom: 60px; right: 0;
            background: rgba(0, 0, 0, 0.95);
            border: 1px solid #ff66b2;
            padding: 10px;
            border-radius: 20px;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 0 15px rgba(255, 102, 178, 0.5);
        }
        .sub-menu-colores.visible-rose { display: flex; }
    </style>
</head>
<body>

<header>
    <a href="index.html" class="btn-inicio">🏠 Inicio</a>
    <p class="frase-biblioteca">Tu biblioteca de historias favoritas</p>
</header>

<div class="seccion-titulo">En Emisión</div>
<div class="grid-historias" id="grid-emision"></div>

<div class="seccion-titulo">En Hiatus</div>
<div class="grid-historias" id="grid-hiatus"></div>

<div class="seccion-titulo">Finalizados</div>
<div class="grid-historias" id="grid-finalizado"></div>

<div class="menu-colores-flotante" style="position: fixed; bottom: 30px; right: 20px; z-index: 99999;">
    <button onclick="toggleMenuColores(event)" style="background: #111111; border: 2px solid #ff66b2; width: 48px; height: 48px; border-radius: 50%; cursor: pointer; font-size: 1.25rem; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 20px rgba(255, 102, 178, 0.6); outline: none;">
        🎨
    </button>
    <div class="sub-menu-colores" id="sub-menu-colores">
        <div onclick="cambiarTemaRose('dark')"  style="width:22px;height:22px;background:#000;border-radius:50%;border:1.5px solid white;cursor:pointer;" title="Modo Oscuro"></div>
        <div onclick="cambiarTemaRose('gris')"  style="width:22px;height:22px;background:#2c2c2c;border-radius:50%;border:1.5px solid white;cursor:pointer;" title="Modo Gris"></div>
        <div onclick="cambiarTemaRose('malva')" style="width:22px;height:22px;background:#dfd3e3;border-radius:50%;border:1.5px solid #4a3b4e;cursor:pointer;" title="Modo Malva Suave"></div>
    </div>
</div>

<script src="funciones-rose.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBvTN_fjSZgGcEaraGeWSrnyUci_gsJ9cs",
        authDomain: "prgs-f2ef8.firebaseapp.com",
        projectId: "prgs-f2ef8",
        storageBucket: "prgs-f2ef8.firebasestorage.app",
        messagingSenderId: "639472415083",
        appId: "1:639472415083:web:2940245a8a70ed6c88dc2e"
    };
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const dbInstancia = firebase.firestore();

    function estadoAContenedor(estado) {
        if (estado === "hiatus")     return "hiatus";
        if (estado === "finalizado") return "finalizado";
        return "emision";
    }

    function templatesDrive(url) {
        if (!url) return "";
        if (url.includes('drive.google.com')) {
            let id = url.includes('id=') ? url.split('id=')[1].split('&')[0] : url.split('/d/')[1].split('/')[0];
            return `https://docs.google.com/uc?export=view&id=${id}`;
        }
        return url;
    }

    function formatearTituloProvisional(id) {
        return id.replace(/-/g, ' ').replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
    }

    document.addEventListener("DOMContentLoaded", () => {
        
        dbInstancia.collection("estado_historias").onSnapshot(querySnapshot => {
            
            document.getElementById("grid-emision").innerHTML = "";
            document.getElementById("grid-hiatus").innerHTML = "";
            document.getElementById("grid-finalizado").innerHTML = "";

            querySnapshot.forEach(docSnap => {
                const idHistoria = docSnap.id;
                const datos = docSnap.data();
                const estado = datos.estado || "emision";
                const contenedor = estadoAContenedor(estado);
                
                const tituloMostrado = datos.nombre || formatearTituloProvisional(idHistoria);

                // Creación de la tarjeta
                const tarjeta = document.createElement("a");
                tarjeta.className = "card";
                tarjeta.id = "card-" + idHistoria;
                tarjeta.href = `proyecto.html?id=${idHistoria}`;

                const tag = document.createElement("span");
                tag.className = `estado-tag tag-${contenedor}`;
                tag.innerText = contenedor === "emision" ? "Emisión" : contenedor === "hiatus" ? "Hiatus" : "Finalizado";
                
                const img = document.createElement("img");
                img.className = "portada";
                img.id = "img-" + idHistoria;
                img.src = "portada-defecto.jpg"; 
                img.onerror = function() { this.src = 'portada-defecto.jpg'; };

                const infoDiv = document.createElement("div");
                infoDiv.className = "info";
                infoDiv.innerText = tituloMostrado;

                tarjeta.appendChild(tag);
                tarjeta.appendChild(img);
                tarjeta.appendChild(infoDiv);

                const destinoGrid = document.getElementById("grid-" + contenedor);
                if (destinoGrid) {
                    destinoGrid.appendChild(tarjeta);
                }

                // 🌟 SOLUCIÓN DIRECTA: Buscamos la URL e infectamos directamente el nodo de la imagen 'img' que acabamos de crear
                dbInstancia.collection(idHistoria).doc("informacion_proyecto").get()
                    .then(docInfo => {
                        let urlEncontrada = "";
                        if (docInfo.exists && docInfo.data().portadaUrl && docInfo.data().portadaUrl.length > 30) {
                            urlEncontrada = docInfo.data().portadaUrl;
                        }
                        if (!urlEncontrada) {
                            return dbInstancia.collection(idHistoria).doc("datos_proyecto").get()
                                .then(docProyecto => {
                                    if (docProyecto.exists && docProyecto.data().portadaUrl) {
                                        urlEncontrada = docProyecto.data().portadaUrl;
                                    }
                                    return urlEncontrada;
                                });
                        }
                        return urlEncontrada;
                    })
                    .then(urlFinal => {
                        if (urlFinal) {
                            // Asignación directa y segura sin depender del DOM lento
                            img.src = templatesDrive(urlFinal.trim());
                        }
                    })
                    .catch(err => console.error("Error cargando portadas de " + idHistoria, err));
            });
        }, error => console.error("Error en tiempo real de estados:", error));
    });
</script>
</body>
</html>
