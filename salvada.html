<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salvada por la pequeña dama sin poderes - Rose Garden Scan</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <link rel="stylesheet" href="estilos-rose.css">
    
    <style>
        body { 
            margin: 0; padding: 0; 
            background: var(--fondo-rose, radial-gradient(circle at center, #1a0a1a 0%, #050505 100%)); 
            color: var(--texto-rose, white); 
            font-family: 'serif'; display: flex; flex-direction: column; align-items: center; min-height: 100vh;
        }
        body::before { content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: radial-gradient(white 1px, transparent 1px); background-size: 50px 50px; opacity: 0.1; z-index: -1; }
        
        .contenedor-manga {
            width: 90%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 60px 10px 20px 10px;
        }

        .btn-volver { 
            position: absolute; top: 20px; left: 20px; text-decoration: none; color: #ff66b2; font-weight: bold; font-size: 0.8rem; text-transform: uppercase; border: 1px solid #ff66b2; padding: 8px 15px; border-radius: 20px; transition: 0.3s; background: transparent; z-index: 10;
        }
        .btn-volver:hover { background: #ff66b2; color: white; box-shadow: 0 0 10px #ff66b2; }

        .portada-centrada { 
            width: 85%;
            max-width: 240px;
            height: auto;
            aspect-ratio: 2 / 3;
            object-fit: cover; 
            border-radius: 12px; 
            border: 2px solid #ff66b2; 
            box-shadow: 0 0 20px rgba(255, 102, 178, 0.4); 
            background: #222;
            margin-bottom: 25px;
        }

        .titulo-manga { 
            font-size: 1.8rem; color: #ff66b2; margin: 0 0 15px 0; 
            font-family: 'Georgia', serif; font-weight: bold; line-height: 1.3;
        }

        .sinopsis-texto { 
            font-size: 0.95rem; line-height: 1.6; color: rgba(255, 255, 255, 0.85); 
            margin: 0 0 30px 0; font-family: sans-serif;
            text-align: justify;
            text-align-last: center;
        }

        .seccion-titulo { 
            width: 100%; max-width: 500px; margin: 20px 0 20px 0; font-size: 1.1rem; 
            border-bottom: 2px solid #ff66b2; padding-bottom: 8px; color: #ff66b2; 
            text-transform: uppercase; letter-spacing: 2px; font-weight: bold; 
        }

        .lista-capitulos { 
            display: flex; flex-direction: column; gap: 12px; 
            width: 100%; max-width: 500px; padding-bottom: 60px;
        }

        .btn-capitulo { 
            display: block;
            padding: 14px 20px; background: #3d142b; 
            border: 1px solid #ff66b2; border-radius: 10px; 
            text-decoration: none; color: #ffccff; 
            font-size: 1rem; font-weight: bold; transition: 0.3s; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            text-align: center;
        }
        .btn-capitulo:hover { background: #ff66b2; color: white; transform: translateY(-2px); box-shadow: 0 0 15px rgba(255, 102, 178, 0.5); }
    </style>
</head>
<body>

<a href="historias.html" class="btn-volver">🏠 Volver</a>

<div class="contenedor-manga">
    <img src="salvada.jpg" class="portada-centrada" id="portada-grande-salvada">
    
    <h1 class="titulo-manga">Salvada por la pequeña dama sin poderes</h1>
    
    <p class="sinopsis-texto" id="sinopsis-completa-salvada">Cargando descripción...</p>

    <div class="seccion-titulo">Capítulos Disponibles</div>

    <div class="lista-capitulos" id="contenedor-lista-caps">
        <p style="text-align: center; opacity: 0.6;">Buscando capítulos...</p>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBvTN_fjSZgGcEaraGeWSrnyUci_gsJ9cs",
        authDomain: "prgs-f2ef8.firebaseapp.com",
        projectId: "prgs-f2ef8",
        storageBucket: "prgs-f2ef8.firebasestorage.app",
        messagingSenderId: "639472415083",
        appId: "1:639472415083:web:2940245a8a70ed6c88dc2e"
    };
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const dbInstancia = firebase.firestore();

    function formatearLinkDrive(url) {
        if (!url) return "";
        if (url.includes("drive.google.com")) {
            let id = "";
            if (url.includes("id=")) { id = url.split("id=")[1].split("&")[0]; }
            else if (url.includes("/d/")) { id = url.split("/d/")[1].split("/")[0]; }
            if (id) return `https://docs.google.com/uc?export=view&id=${id}`;
        }
        return url;
    }

    // 1. CARGAR DATOS PRINCIPALES (PORTADA Y SINOPSIS)
    dbInstancia.collection("salvada").doc("datos_proyecto").get().then((docSnapshot) => {
        if (docSnapshot.exists) {
            const datos = docSnapshot.data();
            const imgElemento = document.getElementById("portada-grande-salvada");
            if (imgElemento && datos.portadaUrl) {
                imgElemento.src = formatearLinkDrive(datos.portadaUrl);
            }
            const sinopsisElemento = document.getElementById("sinopsis-completa-salvada");
            if (sinopsisElemento) {
                sinopsisElemento.innerText = datos.sinopsis || "Sin descripción disponible.";
            }
        }
    }).catch((err) => console.log("Error en datos base: ", err));

    // 2. 🔥 RECOLECTAR Y CREAR BOTONES DE CAPÍTULOS EN ORDEN AUTOMÁTICO
    dbInstancia.collection("salvada").get().then((querySnapshot) => {
        let capitulosLista = [];

        querySnapshot.forEach((doc) => {
            // Saltamos el documento de configuración para agarrar solo los capítulos
            if (doc.id !== "datos_proyecto") {
                // Convertimos el ID a número para poder ordenarlos bien (ej: "1.5" pasa a ser el número 1.5)
                const numCap = parseFloat(doc.id);
                if (!isNaN(numCap)) {
                    capitulosLista.push({
                        idTexto: doc.id, // Guardamos el texto original "1", "1.5" para la URL
                        valorNum: numCap
                    });
                }
            }
        });

        // Los ordenamos de menor a mayor matemáticamente para que el 1.5 quede entre el 1 y el 2
        capitulosLista.sort((a, b) => a.valorNum - b.valorNum);

        const contenedor = document.getElementById("contenedor-lista-caps");
        contenedor.innerHTML = ""; // Limpiamos el mensaje de "Buscando..."

        if (capitulosLista.length === 0) {
            contenedor.innerHTML = '<p style="text-align: center; opacity: 0.5;">No hay capítulos publicados aún.</p>';
            return;
        }

        // Creamos cada botón dinámicamente en el HTML
        capitulosLista.forEach((cap) => {
            const boton = document.createElement("a");
            boton.href = `capitulos/salvada/${cap.idTexto}.html`;
            boton.className = "btn-capitulo";
            boton.innerText = `Capítulo ${cap.idTexto}`;
            contenedor.appendChild(boton);
        });

    }).catch((err) => {
        console.log("Error cargando la lista automática de capítulos: ", err);
    });
</script>

</body>
</html>
