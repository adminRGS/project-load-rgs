<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salvada por la pequeña dama sin poderes - Rose Garden Scan</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <link rel="stylesheet" href="estilos-rose.css">
    
    <style>
        body { 
            margin: 0; padding: 0; 
            background: var(--fondo-rose, radial-gradient(circle at center, #1a0a1a 0%, #050505 100%)); 
            color: var(--texto-rose, white); 
            font-family: 'serif'; display: flex; flex-direction: column; align-items: center; min-height: 100vh;
        }
        body::before { content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: radial-gradient(white 1px, transparent 1px); background-size: 50px 50px; opacity: 0.1; z-index: -1; }
        
        /* 🔥 HEADER ADAPTADO PARA PORTADA Y SINOPSIS AL LADO */
        header { 
            padding: 40px 20px 20px 20px; 
            width: 100%; max-width: 900px; 
            display: flex; flex-direction: row; gap: 30px; 
            align-items: flex-start; justify-content: center;
        }
        
        .btn-volver { 
            position: absolute; top: 20px; left: 20px; text-decoration: none; color: #ff66b2; font-weight: bold; font-size: 0.8rem; text-transform: uppercase; border: 1px solid #ff66b2; padding: 8px 15px; border-radius: 20px; transition: 0.3s; background: transparent; z-index: 10;
        }
        .btn-volver:hover { background: #ff66b2; color: white; box-shadow: 0 0 10px #ff66b2; }

        /* 🔥 PORTADA DE DRIVE (Acepta el blindaje automáticamente) */
        .portada-grande { 
            width: 200px; min-width: 200px; height: 300px; object-fit: cover; 
            border-radius: 12px; border: 2px solid #ff66b2; 
            box-shadow: 0 0 20px rgba(255, 102, 178, 0.4); 
            background: #222;
        }

        /* 🔥 CONTENEDOR DE TEXTO (TITULO + SINOPSIS) */
        .info-header { display: flex; flex-direction: column; gap: 15px; flex-grow: 1; margin-top: 20px; }

        .titulo-manga { 
            font-size: 2rem; color: #ff66b2; margin: 0; 
            font-family: 'Georgia', serif; font-weight: bold; line-height: 1.2;
        }

        /* 🔥 ESPACIO VISUAL PARA LA SINOPSIS (Viniendo de Firebase) */
        .sinopsis-texto { 
            font-size: 0.95rem; line-height: 1.5; color: rgba(255, 255, 255, 0.85); 
            margin: 0; font-family: sans-serif;
        }

        .seccion-titulo { width: 90%; max-width: 900px; margin: 40px 0 15px 0; font-size: 1.2rem; border-left: 4px solid #ff66b2; padding-left: 15px; color: #ff66b2; text-transform: uppercase; letter-spacing: 2px; font-weight: bold; }

        /* 🔥 CAMBIO A DISEÑO DE LISTA VERTICAL PARA CAPÍTULOS (Símil reference image 7 but list) */
        .lista-capitulos { 
            display: flex; flex-direction: column; gap: 15px; 
            width: 95%; max-width: 900px; padding: 10px 10px 60px 10px; 
        }

        /* 🔥 BOTONES DE CAPÍTULOS EN FORMATO FILA COMODA */
        .btn-capitulo { 
            display: flex; flex-direction: row; align-items: center; justify-content: space-between;
            padding: 18px 25px; background: #3d142b; /* Fondo oscuro rosa sutil reference */
            border: 1px solid #ff66b2; border-radius: 12px; 
            text-decoration: none; color: #ffccff; /* Texto rosa claro reference */
            font-size: 1.1rem; font-weight: bold; transition: 0.3s; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .btn-capitulo:hover { background: #ff66b2; color: white; transform: translateY(-3px); box-shadow: 0 0 20px rgba(255, 102, 178, 0.5); }
        
        .numero-cap { font-size: 1.3rem; margin-right: 15px; color: #ff66b2; } /* Número grande reference */
        .btn-capitulo:hover .numero-cap { color: white; }
    </style>
</head>
<body>

<a href="historias.html" class="btn-volver">🏠 Volver</a>

<header>
    <img src="salvada.jpg" class="portada-grande" id="portada-grande-salvada">
    <div class="info-header">
        <h1 class="titulo-manga">Salvada por la pequeña dama sin poderes</h1>
        <p class="sinopsis-texto" id="sinopsis-completa-salvada">Cargando descripción oficial guardada en Firebase...</p>
    </div>
</header>

<div class="seccion-titulo">Capítulos Disponibles</div>

<div class="lista-capitulos">
    <a href="capitulos/salvada/1.html" class="btn-capitulo"><span><span class="numero-cap">1</span> Capítulo 1</span> <span>➡️</span></a>
    <a href="capitulos/salvada/2.html" class="btn-capitulo"><span><span class="numero-cap">2</span> Capítulo 2</span> <span>➡️</span></a>
    <a href="capitulos/salvada/3.html" class="btn-capitulo"><span><span class="numero-cap">3</span> Capítulo 3</span> <span>➡️</span></a>
    <a href="capitulos/salvada/4.html" class="btn-capitulo"><span><span class="numero-cap">4</span> Capítulo 4</span> <span>➡️</span></a>
    <a href="capitulos/salvada/5.html" class="btn-capitulo"><span><span class="numero-cap">5</span> Capítulo 5</span> <span>➡️</span></a>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBvTN_fjSZgGcEaraGeWSrnyUci_gsJ9cs",
        authDomain: "prgs-f2ef8.firebaseapp.com",
        projectId: "prgs-f2ef8",
        storageBucket: "prgs-f2ef8.firebasestorage.app",
        messagingSenderId: "639472415083",
        appId: "1:639472415083:web:2940245a8a70ed6c88dc2e"
    };
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const dbInstancia = firebase.firestore();

    // 🔥 BLINDAJE ESPECIFICO: Sincroniza portada y sinopsis SÓLO de 'salvada'
    dbInstancia.collection("salvada").doc("datos_proyecto").get().then((docSnapshot) => {
        if (docSnapshot.exists) {
            const datos = docSnapshot.data();
            
            // Actualiza la portada grande si hay link guardado
            const imgElemento = document.getElementById("portada-grande-salvada");
            if (imgElemento && datos.portadaUrl) {
                imgElemento.src = datos.portadaUrl;
            }
            
            // Actualiza la sinopsis completa
            const sinopsisElemento = document.getElementById("sinopsis-completa-salvada");
            if (sinopsisElemento) {
                sinopsisElemento.innerText = datos.sinopsis || "La protagonista, Riersha, es despreciada por su familia por no tener poderes, pero tras morir y regresar al...";
            }
        }
    }).catch((err) => console.log("Error trayendo detalles del proyecto 'salvada': ", err));
</script>

</body>
</html>
