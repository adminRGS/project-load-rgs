<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel Admin - Rose Garden</title>
    <style>
        body { font-family: sans-serif; background: #ffeef4; color: #4a1525; display: flex; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; }
        #login-screen, #admin-panel { width: 100%; max-width: 480px; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(216, 27, 96, 0.1); border: 2px solid #f48fb1; }
        #admin-panel { display: none; }
        h1 { color: #d81b60; text-align: center; font-size: 1.4rem; margin-bottom: 20px; }
        .menu-tabs { display: flex; gap: 8px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 12px; background: #fce4ec; border: none; border-radius: 8px; cursor: pointer; color: #d81b60; font-weight: bold; }
        .tab-btn.active { background: #f48fb1; color: white; }
        .section { display: none; }
        .section.active { display: block; }
        label { display: block; margin-top: 15px; color: #d81b60; font-size: 0.85rem; font-weight: bold; text-transform: uppercase; }
        select, input, textarea { width: 100%; padding: 10px; margin-top: 5px; border-radius: 8px; border: 2px solid #fbc4b6; background: #fff5f8; color: #4a1525; box-sizing: border-box; font-size: 0.95rem; }
        button { width: 100%; padding: 12px; margin-top: 20px; background: #ec407a; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div id="login-screen">
    <h2>Panel de Control</h2>
    <input type="password" id="passInput" placeholder="Contraseña...">
    <button onclick="verificarClave()">Entrar</button>
</div>

<div id="admin-panel">
    <h1>🌸 Panel Administrativo</h1>
    <div class="menu-tabs">
        <button class="tab-btn active" onclick="showSection('cargar', this)">Cargar</button>
        <button class="tab-btn" onclick="showSection('estatus', this)">Estatus</button>
        <button class="tab-btn" onclick="showSection('info', this)">Info</button>
    </div>

    <div id="cargar" class="section active">
        <label>Historia</label>
        <select id="historiaID" class="listaHistorias"></select>
        <label>Capítulo</label>
        <input type="number" id="capNum" step="any" placeholder="Ej: 65 o 14.5">
        <label>Links de Imágenes</label>
        <textarea id="linksRaw" rows="4" placeholder="Pega links aquí..."></textarea>
        <button onclick="guardarCapitulo()">🚀 Guardar Capítulo</button>
    </div>

    <div id="estatus" class="section">
        <label>Historia</label>
        <select id="estatusID" class="listaHistorias"></select>
        <label>Nuevo Estatus</label>
        <select id="nuevoEstatus">
            <option value="emision">En Emisión</option>
            <option value="hiatus">En Hiatus</option>
            <option value="finalizado">Finalizado</option>
        </select>
        <button onclick="updateEstado()">Actualizar Estatus</button>
    </div>

    <div id="info" class="section">
        <label>Historia</label>
        <select id="infoID" class="listaHistorias"></select>
        <label>Portada URL</label>
        <input type="text" id="portadaURL" placeholder="Link">
        <label>Sinopsis</label>
        <textarea id="sinopsis" rows="4"></textarea>
        <button onclick="updateInfo()">Guardar Cambios</button>
    </div>
    <p id="status" style="text-align:center; margin-top:20px; font-weight: bold;"></p>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const historias = [
        {id: "guarderia", nombre: "La guardería de la villana"},
        {id: "confesion", nombre: "Confesión"},
        {id: "embarazada", nombre: "Fingí estar embarazada..."},
        {id: "salvada", nombre: "Salvada por la pequeña dama..."},
        {id: "leopardo", nombre: "La pequeña leopardo de las nieves..."},
        {id: "lobo", nombre: "Soy un lobo pero no te lastimaré"},
        {id: "princesa", nombre: "No solo encanté a la princesa"},
        {id: "matrimonio", nombre: "Matrimonio de conveniencia..."},
        {id: "amigos", nombre: "Los amigos no hacen esto"},
        {id: "hermana", nombre: "Mi hermana era mi enemiga y ahora me ama"}
    ];

    document.querySelectorAll('.listaHistorias').forEach(sel => {
        historias.forEach(h => {
            let opt = document.createElement('option');
            opt.value = h.id; opt.innerText = h.nombre;
            sel.appendChild(opt);
        });
    });

    const db = getFirestore(initializeApp({
        apiKey: "AIzaSyBvTN_fjSZgGcEaraGeWSrnyUci_gsJ9cs",
        projectId: "prgs-f2ef8",
        storageBucket: "prgs-f2ef8.firebasestorage.app"
    }));

    window.verificarClave = () => {
        if(document.getElementById('passInput').value === "Rose2026") {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('admin-panel').style.display = 'block';
        } else alert("Contraseña incorrecta.");
    }

    window.guardarCapitulo = async () => {
        const id = document.getElementById('historiaID').value;
        const num = document.getElementById('capNum').value;
        const raw = document.getElementById('linksRaw').value;
        const status = document.getElementById('status');
        
        let links = raw.split('\n').filter(l => l.trim()).map(l => {
            const idM = l.match(/[-\w]{25,}/);
            return idM ? `https://lh3.googleusercontent.com/d/${idM[0]}=s1600` : null;
        }).filter(l => l);

        try {
            await setDoc(doc(db, id, "capitulo_" + num), { imagenes: links });
            status.innerText = "✅ ¡Guardado!";
            document.getElementById('capNum').value = "";
            document.getElementById('linksRaw').value = "";
        } catch (e) { status.innerText = "❌ Error"; }
    }

    window.showSection = (id, btn) => {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        btn.classList.add('active');
    }

    window.updateEstado = () => alert("Actualizado");
    window.updateInfo = () => alert("Información guardada");
</script>
</body>
</html>
