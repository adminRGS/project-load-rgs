<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel - Rose Garden Scan</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <style>
        :root { color-scheme: light !important; }
        body { font-family: sans-serif; background-color: #ffeef4 !important; color: #4a1525 !important; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        #bloque-login { width: 100%; max-width: 400px; background: white; padding: 25px; border-radius: 20px; border: 2px solid #f48fb1; text-align: center; margin-top: 50px; }
        #contenido-panel { width: 100%; max-width: 500px; display: none; flex-direction: column; align-items: center; }
        .seccion-admin { display: none; width: 100%; background: white !important; padding: 25px; border-radius: 20px; border: 2px solid #f48fb1 !important; margin-bottom: 20px; }
        .seccion-admin.activa { display: block; }
        .btn-menu { width: 100%; padding: 15px; margin-bottom: 10px; border: 2px solid #f48fb1 !important; background: white; color: #d81b60; font-weight: bold; cursor: pointer; border-radius: 12px; }
        .btn-guardar { background: #ec407a !important; color: white !important; border: none; padding: 15px; border-radius: 12px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }
        input, select, textarea { width: 100%; padding: 12px; margin: 10px 0; border: 2px solid #fbc4b6; border-radius: 12px; box-sizing: border-box; }
        label { font-weight: bold; color: #ad1457; font-size: 0.8rem; text-transform: uppercase; display: block; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>🌸 Panel de Control 🌸</h1>
    
    <div id="bloque-login">
        <label>Contraseña de Acceso</label>
        <input type="password" id="pass-input">
        <button class="btn-guardar" onclick="verificar()">Entrar</button>
    </div>

    <div id="contenido-panel">
        <div class="menu-administracion" style="width:100%">
            <button class="btn-menu" onclick="mostrar('opcion-cargar')">📂 Cargar Capítulo</button>
            <button class="btn-menu" onclick="mostrar('opcion-estatus')">🔄 Actualizar Estatus</button>
            <button class="btn-menu" onclick="mostrar('opcion-editar')">✨ Crear / Editar Proyecto</button>
        </div>

        <div id="opcion-cargar" class="seccion-admin activa">
            <label>Proyecto</label><select id="select-p1"></select>
            <label>Capítulo</label><input type="number" id="num-cap" placeholder="Número Capítulo">
            <label>Imágenes</label><input type="file" id="input-archivo" multiple>
            <button class="btn-guardar" onclick="subirGitHub()">Publicar en GitHub y Firebase</button>
        </div>

        <div id="opcion-estatus" class="seccion-admin">
            <label>Historia</label><select id="select-p2"></select>
            <label>Estado</label>
            <select id="nuevo-estado">
                <option value="emision">🔴 En Emisión</option>
                <option value="hiatus">🟡 En Hiatus</option>
                <option value="finalizado">💖 Finalizado</option>
            </select>
            <button class="btn-guardar" onclick="guardarFirebase('estatus')">💾 Guardar Estatus</button>
        </div>

        <div id="opcion-editar" class="seccion-admin">
            <label>Proyecto</label><select id="select-p3"></select>
            <label>Portada</label><input type="file" id="input-portada">
            <label>Sinopsis</label><textarea id="editar-sinopsis" placeholder="Escribe la sinopsis aquí..."></textarea>
            <button class="btn-guardar" onclick="guardarFirebase('edicion')">💾 Guardar Cambios</button>
        </div>
    </div>

    <script>
        const proyectos = [
            { id: "leopardo", nombre: "La pequeña bebé leopardo de las nieves" },
            { id: "amigos", nombre: "Los amigos no hacen esto" },
            { id: "hermana", nombre: "Mi hermana que era mi enemiga" },
            { id: "salvada", nombre: "Salvada por la pequeña dama" },
            { id: "confesion", nombre: "Confesión" },
            { id: "embarazada", nombre: "Fingí estar embarazada" },
            { id: "lobo", nombre: "Soy un lobo" },
            { id: "matrimonio", nombre: "Matrimonio de conveniencia" },
            { id: "guarderia", nombre: "La guardería de la villana" },
            { id: "princesa", nombre: "No solo encante a la princesa!" }
        ];

        function verificar() {
            if(document.getElementById('pass-input').value === "Rose2026") {
                document.getElementById('bloque-login').style.display = 'none';
                document.getElementById('contenido-panel').style.display = 'flex';
            } else { alert("Contraseña incorrecta"); }
        }

        function mostrar(id) {
            document.querySelectorAll('.seccion-admin').forEach(s => s.classList.remove('activa'));
            document.getElementById(id).classList.add('activa');
        }

        window.onload = () => {
            ["select-p1", "select-p2", "select-p3"].forEach(id => {
                const s = document.getElementById(id);
                proyectos.forEach(p => {
                    let opt = document.createElement("option"); opt.value = p.id; opt.textContent = p.nombre;
                    s.appendChild(opt);
                });
            });
        };

        async function subirGitHub() { alert("Subiendo..."); }
        function guardarFirebase(tipo) { alert("Guardando " + tipo + " en Firebase..."); }
    </script>
</body>
</html>
