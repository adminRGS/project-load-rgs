<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rose Garden Scan Admin 2.0</title>

<style>
*{
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    margin:0;
    background:#ffe6ef;
    color:#5a2a3b;
}

header{
    background:#d94f8a;
    color:white;
    padding:20px;
    text-align:center;
    font-size:1.6rem;
    font-weight:bold;
}

.pantalla{
    display:none;
    padding:20px;
}

.activa{
    display:block;
}

.card{
    background:white;
    border-radius:20px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:15px;
    margin-top:10px;
    background:#e75480;
    color:white;
    font-size:1rem;
    font-weight:bold;
    cursor:pointer;
}

input,
textarea,
select{
    width:100%;
    padding:12px;
    border-radius:12px;
    border:1px solid #ccc;
    margin-top:10px;
    margin-bottom:10px;
}

textarea{
    min-height:120px;
}

.volver{
    background:#999;
}

#login{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:#ffe6ef;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
}

.login-card{
    background:white;
    padding:30px;
    width:90%;
    max-width:350px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 4px 15px rgba(0,0,0,0.2);
}
</style>
</head>

<body>

<div id="login">
    <div class="login-card">

        <h2>🌹 Rose Garden Scan</h2>

        <input
            type="password"
            id="clave"
            placeholder="Contraseña">

        <button onclick="entrar()">
            Entrar
        </button>

        <p id="mensajeLogin"
           style="color:red;"></p>

    </div>
</div>

<header>
🌹 Rose Garden Scan Admin 2.0
</header>

<div id="inicio" class="pantalla activa">

    <div class="card">

        <button onclick="abrir('subir')">
            📚 Subir capítulo
        </button>

        <button onclick="abrir('editar')">
            📝 Editar historias
        </button>

        <button onclick="abrir('nueva')">
            ➕ Crear nueva historia
        </button>

        <button onclick="configurarToken()">
            🔑 Configurar Token GitHub
        </button>

        <button onclick="salir()">
            🚪 Cerrar sesión
        </button>

    </div>

</div>

<!-- SUBIR CAPITULO -->
<div id="subir" class="pantalla">

    <div class="card">

        <h2>📚 Subir capítulo</h2>

        <label>Historia</label>

        <select id="historia">
            <option value="leopardo">La pequeña bebé leopardo...</option>
            <option value="amigos">Los amigos no hacen esto</option>
            <option value="hermana">Mi hermana que era mi enemiga ahora me ama</option>
            <option value="salvada">Salvada por la pequeña dama sin poderes</option>
            <option value="confesion">Confesión</option>
            <option value="embarazada">Fingí estar embarazada pero mi marido regresó</option>
            <option value="lobo">Soy un lobo pero no te lastimaré</option>
            <option value="matrimonio">Matrimonio de conveniencia a una obsesión</option>
            <option value="guarderia">La guardería de la villana</option>
            <option value="princesa">¡No, solo encanté a la princesa!</option>
        </select>

        <label>Capítulo</label>

        <input
            type="text"
            id="numeroCapitulo"
            placeholder="Ej: 1 o 43.5">

        <label>Imágenes</label>

        <input
            type="file"
            id="imagenes"
            multiple>

        <button onclick="subirCapitulo()">
            🚀 Publicar capítulo
        </button>

        <button
            class="volver"
            onclick="abrir('inicio')">
            ← Volver
        </button>

    </div>

</div>
<!-- EDITAR -->
<div id="editar" class="pantalla">

    <div class="card">

        <h2>📝 Editar historia</h2>

        <label>Historia</label>

        <select id="editarHistoria">
            <option value="leopardo">La pequeña bebé leopardo...</option>
            <option value="amigos">Los amigos no hacen esto</option>
            <option value="hermana">Mi hermana que era mi enemiga ahora me ama</option>
            <option value="salvada">Salvada por la pequeña dama sin poderes</option>
            <option value="confesion">Confesión</option>
            <option value="embarazada">Fingí estar embarazada pero mi marido regresó</option>
            <option value="lobo">Soy un lobo pero no te lastimaré</option>
            <option value="matrimonio">Matrimonio de conveniencia a una obsesión</option>
            <option value="guarderia">La guardería de la villana</option>
            <option value="princesa">¡No, solo encanté a la princesa!</option>
        </select>

        <label>Nueva portada</label>
        <input type="file" id="nuevaPortada">

        <label>Sinopsis</label>
        <textarea id="nuevaSinopsis"></textarea>

        <label>Estado</label>

        <select id="nuevoEstado">
            <option value="En emisión">En emisión</option>
            <option value="Hiatus">Hiatus</option>
            <option value="Finalizado">Finalizado</option>
        </select>

        <button onclick="guardarCambios()">
            💾 Guardar cambios
        </button>

        <button
            class="volver"
            onclick="abrir('inicio')">
            ← Volver
        </button>

    </div>

</div>

<!-- NUEVA HISTORIA -->
<div id="nueva" class="pantalla">

    <div class="card">

        <h2>➕ Nueva historia</h2>

        <label>ID corto</label>
        <input
            type="text"
            id="nuevoID"
            placeholder="ej: leopardo">

        <label>Nombre largo</label>
        <input
            type="text"
            id="nuevoNombre">

        <label>Portada</label>
        <input
            type="file"
            id="portadaNuevaHistoria">

        <label>Sinopsis</label>
        <textarea id="sinopsisNuevaHistoria"></textarea>

        <label>Estado</label>

        <select id="estadoNuevaHistoria">
            <option value="En emisión">En emisión</option>
            <option value="Hiatus">Hiatus</option>
            <option value="Finalizado">Finalizado</option>
        </select>

        <button onclick="crearHistoria()">
            🌹 Crear historia
        </button>

        <button
            class="volver"
            onclick="abrir('inicio')">
            ← Volver
        </button>

    </div>

</div>

<script>
    const GITHUB_USUARIO = "adminRGS";
const GITHUB_REPO = "project-load-rgs";
const GITHUB_BRANCH = "main";

function abrir(id){

    document
        .querySelectorAll(".pantalla")
        .forEach(p=>{
            p.classList.remove("activa");
        });

    document
        .getElementById(id)
        .classList.add("activa");
}

function entrar(){

    const clave =
        document.getElementById("clave").value;

    if(clave === "Rose2026"){

        localStorage.setItem(
            "rose_admin",
            "ok"
        );

        document.getElementById(
            "login"
        ).style.display = "none";

    }else{

        document.getElementById(
            "mensajeLogin"
        ).innerText =
        "Contraseña incorrecta.";
    }
}

function salir(){

    localStorage.removeItem(
        "rose_admin"
    );

    location.reload();
}

window.onload = function(){

    if(
        localStorage.getItem(
            "rose_admin"
        )
    ){
        document.getElementById(
            "login"
        ).style.display = "none";
    }
};

function configurarToken(){

    const token = prompt(
        "Pega tu token de GitHub"
    );

    if(!token) return;

    localStorage.setItem(
        "github_token",
        token
    );

    alert(
        "Token guardado correctamente."
    );
}

function obtenerToken(){

    return localStorage.getItem(
        "github_token"
    );
}

function convertirBase64(
    archivo
){

    return new Promise(resolve=>{

        const lector =
            new FileReader();

        lector.onload = ()=>{

            resolve(
                lector.result
                    .split(",")[1]
            );
        };

        lector.readAsDataURL(
            archivo
        );
    });
}

async function subirImagenGitHub(
    archivo,
    carpeta
){

    const token =
        obtenerToken();

    if(!token){

        alert(
            "Primero configura el token."
        );

        return null;
    }

    const nombre =
        Date.now() +
        "_" +
        archivo.name;

    const ruta =
        `${carpeta}/${nombre}`;

    const contenido =
        await convertirBase64(
            archivo
        );

    const respuesta =
        await fetch(
            `https://api.github.com/repos/${GITHUB_USUARIO}/${GITHUB_REPO}/contents/${ruta}`,
            {
                method:"PUT",
                headers:{
                    Authorization:
                        `token ${token}`,
                    Accept:
                        "application/vnd.github+json"
                },
                body:JSON.stringify({
                    message:
                        `Subir ${nombre}`,
                    content:
                        contenido,
                    branch:
                        GITHUB_BRANCH
                })
            }
        );

    const datos =
        await respuesta.json();

    if(datos.content){

        return `https://raw.githubusercontent.com/${GITHUB_USUARIO}/${GITHUB_REPO}/${GITHUB_BRANCH}/${ruta}`;
    }

    console.log(datos);

    return null;
}

async function subirCapitulo(){

    const historia =
        document.getElementById(
            "historia"
        ).value;

    const numero =
        document.getElementById(
            "numeroCapitulo"
        ).value;

    const archivos =
        document.getElementById(
            "imagenes"
        ).files;

    if(!numero){

        alert(
            "Ingresa el número del capítulo."
        );

        return;
    }

    if(
        archivos.length === 0
    ){

        alert(
            "Selecciona imágenes."
        );

        return;
    }

    const enlaces = [];

    for(
        let archivo
        of archivos
    ){

        const url =
            await subirImagenGitHub(
                archivo,
                `${historia}/capitulo_${numero}`
            );

        if(url){

            enlaces.push(url);
        }
    }

    console.log(
        enlaces
    );

    alert(
        "Se subieron " +
        enlaces.length +
        " imágenes correctamente."
    );
}

function guardarCambios(){

    alert(
        "La conexión con Firebase se agregará en la siguiente etapa."
    );
}

function crearHistoria(){

    alert(
        "La creación automática de historias se agregará en la siguiente etapa."
    );
}
</script>

</body>
</html>
