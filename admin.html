<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel Admin - Rose Garden</title>
    <style>
        body { font-family: sans-serif; background: #ffeef4; color: #4a1525; display: flex; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; }
        #login-screen, #admin-panel { width: 100%; max-width: 400px; background: white; padding: 20px; border-radius: 20px; border: 2px solid #f48fb1; box-shadow: 0 5px 15px rgba(216, 27, 96, 0.1); }
        #admin-panel { display: none; }
        h1 { color: #d81b60; font-size: 1.2rem; text-align: center; }
        .tabs { display: flex; gap: 5px; margin: 20px 0; }
        .tab-btn { flex: 1; padding: 10px; background: #fce4ec; border: none; border-radius: 8px; font-weight: bold; color: #d81b60; cursor: pointer; }
        .tab-btn.active { background: #f48fb1; color: white; }
        .section { display: none; }
        .section.active { display: block; }
        label { display: block; margin-top: 10px; font-size: 0.7rem; font-weight: bold; color: #d81b60; text-transform: uppercase; }
        select, input, textarea { width: 100%; padding: 10px; margin-top: 4px; border: 2px solid #fbc4b6; border-radius: 8px; background: #fff5f8; box-sizing: border-box; }
        button { width: 100%; padding: 12px; margin-top: 15px; background: #ec407a; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div id="login-screen">
    <h1>🌸 Panel Admin - Rose Garden 🌸</h1>
    <input type="password" id="passInput" placeholder="Contraseña...">
    <button onclick="verificarClave()">Entrar</button>
</div>

<div id="admin-panel">
    <h1>🌸 Panel Administrativo 🌸</h1>
    <div class="tabs">
        <button class="tab-btn active" onclick="showSection('cargar', this)">Cargar</button>
        <button class="tab-btn" onclick="showSection('estatus', this)">Estatus</button>
        <button class="tab-btn" onclick="showSection('info', this)">Info</button>
    </div>

    <div id="cargar" class="section active">
        <label>Historia</label>
        <select id="historiaID" class="lista"></select>
        <label>Capítulo</label>
        <input type="number" id="capNum" step="any">
        <label>Links Imágenes</label>
        <textarea id="linksRaw" rows="3"></textarea>
        <button onclick="guardarCapitulo()">🚀 Guardar Capítulo</button>
    </div>

    <div id="estatus" class="section">
        <label>Historia</label>
        <select id="estatusID" class="lista"></select>
        <label>Estatus Actual</label>
        <input type="text" id="statusActual" disabled>
        <label>Nuevo Estatus</label>
        <select id="nuevoEstatus">
            <option value="Emisión">En Emisión</option>
            <option value="Hiatus">En Hiatus</option>
            <option value="Finalizado">Finalizado</option>
        </select>
        <button onclick="updateEstado()">Actualizar Estatus</button>
    </div>

    <div id="info" class="section">
        <label>Seleccionar Historia</label>
        <select id="infoID" class="lista"></select>
        <label>Nueva Portada (Link)</label>
        <input type="text" id="portadaURL" placeholder="Link (se convertirá a lh3)">
        <label>Sinopsis</label>
        <textarea id="sinopsis" rows="3"></textarea>
        <button onclick="updateInfo()">Guardar Cambios</button>
        <hr style="border:0; border-top:1px solid #fbc4b6; margin: 20px 0;">
        <h2 style="font-size:0.9rem; color:#d81b60;">Crear nuevo proyecto</h2>
        <input type="text" id="newID" placeholder="ID Corto">
        <input type="text" id="newName" placeholder="Nombre Largo">
        <button onclick="crearProyecto()">Crear Proyecto</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const historias = [
        {id: "guarderia", nombre: "La guardería de la villana"},
        {id: "confesion", nombre: "Confesión de amor"},
        {id: "embarazada", nombre: "Fingí estar embarazada..."},
        {id: "salvada", nombre: "Salvada por la pequeña dama..."},
        {id: "leopardo", nombre: "La pequeña leopardo de las nieves..."},
        {id: "lobo", nombre: "Soy un lobo pero no te lastimaré"},
        {id: "princesa", nombre: "No solo encanté a la princesa"},
        {id: "matrimonio", nombre: "Matrimonio de conveniencia..."},
        {id: "amigos", nombre: "Los amigos no hacen esto"},
        {id: "hermana", nombre: "Mi hermana era mi enemiga y ahora me ama"}
    ];

    document.querySelectorAll('.lista').forEach(s => historias.forEach(h => {
        let o = document.createElement('option');
        o.value = h.id; o.innerText = h.nombre; s.appendChild(o);
    }));

    const db = getFirestore(initializeApp({
        apiKey: "AIzaSyBvTN_fjSZgGcEaraGeWSrnyUci_gsJ9cs",
        projectId: "prgs-f2ef8",
        storageBucket: "prgs-f2ef8.firebasestorage.app"
    }));

    window.verificarClave = () => {
        if(document.getElementById('passInput').value === "Rose2026") {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('admin-panel').style.display = 'block';
        } else alert("Clave incorrecta");
    }

    window.guardarCapitulo = async () => {
        const id = document.getElementById('historiaID').value;
        const num = document.getElementById('capNum').value;
        const raw = document.getElementById('linksRaw').value;
        let links = raw.split('\n').filter(l => l.trim()).map(l => {
            const m = l.match(/[-\w]{25,}/);
            return m ? `https://lh3.googleusercontent.com/d/${m[0]}=s1600` : null;
        }).filter(l => l);

        await setDoc(doc(db, id, "capitulo_" + num), { imagenes: links });
        alert("¡Guardado!");
        document.getElementById('capNum').value = "";
        document.getElementById('linksRaw').value = "";
    }

    window.showSection = (id, btn) => {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        btn.classList.add('active');
    }
    
    // Las funciones updateEstado e updateInfo ahora pueden ser completadas con la lógica de Firebase
</script>
</body>
</html>
