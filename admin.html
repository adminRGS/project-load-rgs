<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Rose Garden Scan</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <style>
        :root { color-scheme: light !important; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #ffeef4 !important; color: #4a1525 !important; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        h1 { color: #d81b60 !important; text-align: center; font-family: 'Georgia', serif; margin-bottom: 25px; font-size: 1.8rem; }
        #bloque-login { background: #ffffff !important; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(216, 27, 96, 0.15); border: 2px solid #f48fb1 !important; text-align: center; max-width: 340px; width: 100%; box-sizing: border-box; margin-top: 40px; }
        #contenido-panel { display: none; width: 100%; max-width: 500px; flex-direction: column; align-items: center; }
        .menu-administracion { display: flex; flex-direction: column; gap: 12px; width: 100%; margin-bottom: 30px; }
        .btn-menu { width: 100%; padding: 16px; background: #ffffff !important; border: 2px solid #f48fb1 !important; color: #d81b60 !important; border-radius: 14px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: all 0.3s ease; text-align: center; box-sizing: border-box; }
        .btn-menu:hover, .btn-menu.activo { background: #f48fb1 !important; color: white !important; box-shadow: 0 5px 15px rgba(244, 139, 177, 0.4); transform: translateY(-2px); }
        .seccion-admin { display: none; width: 100%; background: #ffffff !important; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(216, 27, 96, 0.1); border: 2px solid #f48fb1 !important; box-sizing: border-box; margin-bottom: 30px; }
        .seccion-admin.activa { display: block; }
        .seccion-admin h2 { color: #d81b60 !important; margin-top: 0; font-size: 1.4rem; border-bottom: 2px dashed #fde4ec; padding-bottom: 10px; }
        .grupo-control { margin-bottom: 18px; display: flex; flex-direction: column; gap: 8px; }
        label { font-weight: bold; color: #ad1457 !important; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px; }
        input, select, textarea { padding: 14px; background: #fff5f8 !important; border: 2px solid #fbc4b6 !important; color: #4a1525 !important; border-radius: 12px; font-size: 1rem; outline: none; width: 100%; box-sizing: border-box; }
        .btn-guardar { background: #ec407a !important; color: white !important; border: none; padding: 15px; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 1rem; width: 100%; }
        #caja-estado-actual { background: #fff5f8; border: 2px solid #fbc4b6; border-radius: 12px; padding: 14px; margin-bottom: 18px; display: flex; align-items: center; gap: 10px; font-size: 1rem; font-weight: bold; color: #4a1525; min-height: 48px; }
        .badge { padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; text-transform: uppercase; }
        .badge-emision { background: #4caf50; color: white; }
        .badge-hiatus { background: #ffd700; color: black; }
        .badge-finalizado { background: #ff66b2; color: white; }
    </style>
</head>
<body>
    <h1>🌸 Panel de Control - Rose Garden Scan 🌸</h1>
    <div id="bloque-login">
        <h2 style="color:#d81b60;">🌸 Acceso Administrativo</h2>
        <div class="grupo-control">
            <label>Contraseña</label>
            <input type="password" id="clave-input">
        </div>
        <button class="btn-guardar" onclick="verificarClave()">Entrar</button>
    </div>

    <div id="contenido-panel">
        <div class="menu-administracion">
            <button class="btn-menu" onclick="abrirSeccion(event,'opcion-cargar')">📂 Cargar Capítulo</button>
            <button class="btn-menu" onclick="abrirSeccion(event,'opcion-estatus')">🔄 Actualizar Estatus</button>
            <button class="btn-menu" onclick="abrirSeccion(event,'opcion-nuevo')">✨ Crear / Editar Proyecto</button>
        </div>

        <div id="opcion-cargar" class="seccion-admin">
            <h2>📂 Cargar Capítulo</h2>
            <select id="select-proyecto-capitulo"><option value="">Cargando...</option></select>
            <input type="number" id="num-capitulo" placeholder="Número" step="any">
            <label>Imágenes (Subir a GitHub)</label>
            <input type="file" id="input-imgs" multiple accept="image/*">
            <button class="btn-guardar" onclick="procesarSubidaGitHub()">Subir y Publicar</button>
            <hr>
            <label>Links (Drive)</label>
            <textarea id="enlaces-imagenes" rows="3"></textarea>
            <button class="btn-guardar" onclick="subirCapitulo()">Publicar con Links</button>
        </div>

        <div id="opcion-estatus" class="seccion-admin">
            <h2>🔄 Actualizar Estatus</h2>
            <select id="select-proyecto-estatus" onchange="cargarEstadoActual()"></select>
            <div id="caja-estado-actual"></div>
            <select id="nuevo-estado-valor">
                <option value="emision">🔴 En Emisión</option>
                <option value="hiatus">🟡 En Hiatus</option>
                <option value="finalizado">💖 Finalizado</option>
            </select>
            <button class="btn-guardar" onclick="actualizarEstadoFirebase()">💾 Guardar Estado</button>
        </div>

        <div id="opcion-nuevo" class="seccion-admin">
            <h2>✨ Crear / Editar Proyecto</h2>
            <input type="text" id="nuevo-id" placeholder="ID">
            <input type="text" id="nuevo-titulo" placeholder="Nombre">
            <input type="text" id="nuevo-portada" placeholder="Portada">
            <textarea id="nuevo-sinopsis" placeholder="Sinopsis"></textarea>
            <button class="btn-guardar" onclick="crearNuevoProyecto()">Guardar Nuevo</button>
            <hr>
            <select id="select-proyecto-editar" onchange="cargarPortadaActualEditar()"></select>
            <input type="text" id="editar-portada">
            <textarea id="editar-sinopsis"></textarea>
            <button class="btn-guardar" onclick="guardarEdicionProyecto()">Guardar Edición</button>
        </div>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyBvTN_fjSZgGcEaraGeWSrnyUci_gsJ9cs", authDomain: "prgs-f2ef8.firebaseapp.com", projectId: "prgs-f2ef8", storageBucket: "prgs-f2ef8.firebasestorage.app", appId: "1:639472415083:web:2940245a8a70ed6c88dc2e" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const GITHUB_REPO = "adminGRS/RoseGardenAdmin";

        function obtenerToken() {
            let token = localStorage.getItem('mi_token_github');
            if (!token) {
                token = prompt("Ingresa tu GitHub Token:");
                if (token) localStorage.setItem('mi_token_github', token);
            }
            return token;
        }

        async function subirAGitHub(file, path) {
            const token = obtenerToken();
            const reader = new FileReader();
            return new Promise((resolve) => {
                reader.onloadend = async () => {
                    const base64 = reader.result.split(',')[1];
                    const res = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/${path}`, {
                        method: 'PUT',
                        headers: { Authorization: `token ${token}`, "Content-Type": "application/json" },
                        body: JSON.stringify({ message: "Upload", content: base64 })
                    });
                    const data = await res.json();
                    resolve(data.content.download_url);
                };
                reader.readAsDataURL(file);
            });
        }

        async function procesarSubidaGitHub() {
            const proy = document.getElementById("select-proyecto-capitulo").value;
            const cap = document.getElementById("num-capitulo").value;
            const files = document.getElementById("input-imgs").files;
            if(!proy || !cap || files.length === 0) return alert("Completa los datos");
            alert("Subiendo...");
            let links = [];
            for (let i = 0; i < files.length; i++) {
                links.push(await subirAGitHub(files[i], `${proy}/cap_${cap}/img_${i}.jpg`));
            }
            await db.collection(proy).doc("capitulo_" + cap).set({ numero: cap, imagenes: links, fecha: new Date() });
            alert("¡Publicado!");
        }

        function verificarClave() { if (document.getElementById("clave-input").value === "Rose2026") { document.getElementById("bloque-login").style.display = "none"; document.getElementById("contenido-panel").style.display = "flex"; cargarProyectosDesdeFirebase(); } else { alert("Clave mal"); } }
        function abrirSeccion(e, id) { document.querySelectorAll('.seccion-admin').forEach(sec => sec.classList.remove('activa')); document.getElementById(id).classList.add('activa'); }
        function blindarEnlaceDrive(l) { if (!l) return ""; l = l.trim(); if (l.includes('uc?export=view')) return l; let id = ""; const mD = l.match(/\/d\/([\w-]+)/); if (mD && mD[1]) id = mD[1]; else { const mI = l.match(/[?&]id=([\w-]+)/); if (mI && mI[1]) id = mI[1]; } return id ? `https://docs.google.com/uc?export=view&id=${id}` : l; }
        function cargarProyectosDesdeFirebase() { const selects = [document.getElementById("select-proyecto-capitulo"), document.getElementById("select-proyecto-estatus"), document.getElementById("select-proyecto-editar")]; selects.forEach(s => s.innerHTML = '<option value="">-- Selecciona --</option>'); db.collection("estado_historias").orderBy("nombre").get().then(qs => { qs.forEach(d => { const id = d.id; const nom = d.data().nombre || id; selects.forEach(s => { const o = document.createElement("option"); o.value = id; o.textContent = nom; s.appendChild(o); }); }); }); }
        function cargarEstadoActual() { const id = document.getElementById("select-proyecto-estatus").value; const caja = document.getElementById("caja-estado-actual"); if (!id) return; db.collection("estado_historias").doc(id).get().then(d => { let est = d.exists && d.data().estado ? d.data().estado : "emision"; mostrarBadgeEstado(caja, est); document.getElementById("nuevo-estado-valor").value = est; }); }
        function mostrarBadgeEstado(caja, est) { const etiq = { emision: { t: "🔴 En Emisión", c: "badge-emision" }, hiatus: { t: "🟡 En Hiatus", c: "badge-hiatus" }, finalizado: { t: "💖 Finalizado", c: "badge-finalizado" } }; const info = etiq[est] || { t: est, c: "badge-emision" }; caja.innerHTML = `<span class="badge ${info.c}">${info.t}</span>`; }
        function actualizarEstadoFirebase() { const id = document.getElementById("select-proyecto-estatus").value; const est = document.getElementById("nuevo-estado-valor").value; if (!id) return; db.collection("estado_historias").doc(id).set({ estado: est }, { merge: true }).then(() => alert("¡Actualizado!")); }
        function subirCapitulo() { const p = document.getElementById("select-proyecto-capitulo").value; const n = document.getElementById("num-capitulo").value; const l = document.getElementById("enlaces-imagenes").value.split("\n").filter(a => a.trim() !== "").map(a => blindarEnlaceDrive(a.trim())); if (!p || !n || l.length === 0) return alert("Completa campos."); db.collection(p).doc("capitulo_" + n).set({ numero: n, imagenes: l, fecha: new Date() }).then(() => alert("¡Publicado!")); }
        function crearNuevoProyecto() { const id = document.getElementById("nuevo-id").value.trim(); const tit = document.getElementById("nuevo-titulo").value.trim(); const por = blindarEnlaceDrive(document.getElementById("nuevo-portada").value.trim()); const sin = document.getElementById("nuevo-sinopsis").value.trim(); if (!id || !tit) return alert("ID y Nombre obligatorios."); db.collection("estado_historias").doc(id).set({ nombre: tit, portadaUrl: por, sinopsis: sin, estado: "emision" }, { merge: true }).then(() => { alert("¡Creado!"); cargarProyectosDesdeFirebase(); }); }
        function guardarEdicionProyecto() { const id = document.getElementById("select-proyecto-editar").value; const por = blindarEnlaceDrive(document.getElementById("editar-portada").value.trim()); const sin = document.getElementById("editar-sinopsis").value.trim(); if (!id) return; db.collection("estado_historias").doc(id).set({ portadaUrl: por, sinopsis: sin }, { merge: true }).then(() => alert("¡Actualizado!")); }
        function cargarPortadaActualEditar() { const id = document.getElementById("select-proyecto-editar").value; if (!id) return; db.collection("estado_historias").doc(id).get().then(d => { if (d.exists) { const da = d.data(); document.getElementById("editar-portada").value = da.portadaUrl || ""; document.getElementById("editar-sinopsis").value = da.sinopsis || ""; } }); }
    </script>
</body>
</html>
