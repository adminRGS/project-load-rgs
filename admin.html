<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Rose Garden - Admin</title>
    <style>
        body { font-family: sans-serif; background: #ffeef4; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        #login-screen, #admin-panel { background: white; padding: 20px; border-radius: 15px; border: 2px solid #ec407a; width: 320px; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        #admin-panel { display: none; }
        h1 { color: #880e4f; font-size: 1.2rem; margin-bottom: 15px; }
        .tabs { display: flex; gap: 5px; margin-bottom: 15px; }
        .tab-btn { flex: 1; padding: 8px; border: none; border-radius: 5px; background: #f8bbd0; color: #880e4f; font-weight: bold; cursor: pointer; font-size: 0.75rem; }
        .tab-btn.active { background: #ec407a; color: white; }
        .section { display: none; text-align: left; }
        .section.active { display: block; }
        label { display: block; font-size: 0.65rem; font-weight: bold; color: #880e4f; margin-top: 10px; text-transform: uppercase; }
        select, input, textarea { width: 100%; padding: 8px; margin: 3px 0; border: 1px solid #f48fb1; border-radius: 5px; background: #fff5f8; box-sizing: border-box; }
        button { width: 100%; padding: 10px; margin-top: 15px; background: #d81b60; border: none; border-radius: 5px; color: white; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
<div id="login-screen">
    <h1>🌸 Rose Garden 🌸</h1>
    <input type="password" id="passInput" placeholder="Contraseña">
    <button onclick="verificarClave()">Entrar</button>
</div>
<div id="admin-panel">
    <h1>🌸 Panel Administrativo 🌸</h1>
    <div class="tabs">
        <button class="tab-btn active" onclick="show('cargar', this)">Cargar</button>
        <button class="tab-btn" onclick="show('estatus', this)">Estatus</button>
        <button class="tab-btn" onclick="show('info', this)">Info</button>
    </div>
    <div id="cargar" class="section active">
        <label>Historia</label>
        <select id="historiaID" class="lista"></select>
        <label>Capítulo (Permite decimales)</label>
        <input type="number" id="capNum" step="any" placeholder="Ej: 14.5">
        <label>Links Imágenes (Copia tal cual de Drive)</label>
        <textarea id="linksRaw" rows="4"></textarea>
        <button onclick="guardarCapitulo()">Guardar Capítulo</button>
    </div>
    <div id="estatus" class="section">
        <label>Historia</label>
        <select id="estatusID" class="lista" onchange="cargarEstatus()"></select>
        <label>Estatus Actual</label>
        <input type="text" id="statusActual" readonly>
        <label>Nuevo Estatus</label>
        <select id="nuevoEstatus">
            <option value="En Emisión">En Emisión</option>
            <option value="Hiatus">Hiatus</option>
            <option value="Finalizado">Finalizado</option>
        </select>
        <button onclick="actualizarEstatus()">Actualizar Estatus</button>
    </div>
    <div id="info" class="section">
        <label>Historia</label>
        <select id="infoID" class="lista" onchange="cargarInfo()"></select>
        <input type="text" id="portadaURL" placeholder="Link Portada (Drive)">
        <textarea id="sinopsis" rows="3" placeholder="Sinopsis"></textarea>
        <button onclick="actualizarInfo()">Guardar Cambios</button>
    </div>
</div>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, setDoc, updateDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    const db = getFirestore(initializeApp({apiKey:"AIzaSyBvTN_fjSZgGcEaraGeWSrnyUci_gsJ9cs",projectId:"prgs-f2ef8",storageBucket:"prgs-f2ef8.firebasestorage.app"}));
    
    const historias = [
        {id:"guarderia", nombre:"La guardería de la villana"},{id:"confesion", nombre:"Confesión"},
        {id:"embarazada", nombre:"Fingí estar embarazada..."},{id:"salvada", nombre:"Salvada por la pequeña dama..."},
        {id:"leopardo", nombre:"La pequeña leopardo de las nieves..."},{id:"lobo", nombre:"Soy un lobo pero no te lastimaré"},
        {id:"princesa", nombre:"No solo encanté a la princesa"},{id:"matrimonio", nombre:"Matrimonio de conveniencia..."},
        {id:"amigos", nombre:"Los amigos no hacen esto"},{id:"hermana", nombre:"Mi hermana era mi enemiga ahora me ama"}
    ];
    document.querySelectorAll('.lista').forEach(s => historias.forEach(h => { let o = document.createElement('option'); o.value=h.id; o.innerText=h.nombre; s.appendChild(o); }));
    
    // Función correcta de conversión a LH3
    const conv = (l) => { const m = l.match(/[-\w]{25,}/); return m ? `https://lh3.googleusercontent.com/d/${m[0]}=s1600` : l; };
    
    window.verificarClave = () => { if(document.getElementById('passInput').value === "Rose2026") { document.getElementById('login-screen').style.display='none'; document.getElementById('admin-panel').style.display='block'; } else alert("Clave mal"); }
    window.show = (id, b) => { document.querySelectorAll('.section').forEach(s => s.classList.remove('active')); document.getElementById(id).classList.add('active'); };
    
    window.guardarCapitulo = async () => { 
        const id = document.getElementById('historiaID').value; 
        const num = document.getElementById('capNum').value; 
        const links = document.getElementById('linksRaw').value.split('\n').filter(l=>l.trim()).map(conv); 
        await setDoc(doc(db, id, "capitulo_"+num), {imagenes: links}); 
        document.getElementById('capNum').value = ""; 
        document.getElementById('linksRaw').value = ""; 
        alert("Guardado exitosamente"); 
    };
    
    window.cargarEstatus = async () => { const s = await getDoc(doc(db, "estados_historias", document.getElementById('estatusID').value)); if(s.exists()) document.getElementById('statusActual').value = s.data().estado || "---"; };
    window.actualizarEstatus = async () => { await updateDoc(doc(db, "estados_historias", document.getElementById('estatusID').value), {estado: document.getElementById('nuevoEstatus').value}); alert("Actualizado"); };
    
    window.cargarInfo = async () => { const s = await getDoc(doc(db, "estados_historias", document.getElementById('infoID').value)); if(s.exists()) { document.getElementById('portadaURL').value = s.data().portadaUrl || ""; document.getElementById('sinopsis').value = s.data().sinopsis || ""; } };
    window.actualizarInfo = async () => { await updateDoc(doc(db, "estados_historias", document.getElementById('infoID').value), {sinopsis: document.getElementById('sinopsis').value, portadaUrl: conv(document.getElementById('portadaURL').value)}); alert("Guardado"); };
</script>
</body>
</html>
