<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel - Rose Garden Scan</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <style>
        :root { color-scheme: light !important; }
        body { font-family: 'Segoe UI', sans-serif; background-color: #ffeef4 !important; color: #4a1525 !important; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        h1 { color: #d81b60 !important; text-align: center; font-family: 'Georgia', serif; margin-bottom: 25px; font-size: 1.8rem; }
        #bloque-login { background: #ffffff !important; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(216, 27, 96, 0.15); border: 2px solid #f48fb1 !important; text-align: center; max-width: 340px; width: 100%; box-sizing: border-box; margin-top: 40px; }
        #contenido-panel { display: none; width: 100%; max-width: 500px; flex-direction: column; align-items: center; }
        .menu-administracion { display: flex; flex-direction: column; gap: 12px; width: 100%; margin-bottom: 30px; }
        .btn-menu { width: 100%; padding: 16px; background: #ffffff !important; border: 2px solid #f48fb1 !important; color: #d81b60 !important; border-radius: 14px; font-size: 1.1rem; font-weight: bold; cursor: pointer; text-align: center; }
        .seccion-admin { display: none; width: 100%; background: #ffffff !important; padding: 25px; border-radius: 20px; border: 2px solid #f48fb1 !important; margin-bottom: 30px; }
        .seccion-admin.activa { display: block; }
        .grupo-control { margin-bottom: 18px; }
        label { font-weight: bold; color: #ad1457 !important; font-size: 0.85rem; text-transform: uppercase; }
        input, select, textarea { padding: 14px; background: #fff5f8 !important; border: 2px solid #fbc4b6 !important; border-radius: 12px; width: 100%; box-sizing: border-box; }
        .btn-guardar { background: #ec407a !important; color: white !important; border: none; padding: 15px; border-radius: 12px; font-weight: bold; cursor: pointer; width: 100%; }
    </style>
</head>
<body>
    <h1>🌸 Panel de Control - Rose Garden Scan 🌸</h1>
    <div id="bloque-login">
        <input type="password" id="clave-input" placeholder="Contraseña">
        <button class="btn-guardar" onclick="verificarClave()">Entrar</button>
    </div>

    <div id="contenido-panel">
        <div class="menu-administracion">
            <button class="btn-menu" onclick="abrirSeccion('opcion-cargar')">📂 Cargar Capítulo</button>
            <button class="btn-menu" onclick="abrirSeccion('opcion-estatus')">🔄 Actualizar Estatus</button>
            <button class="btn-menu" onclick="abrirSeccion('opcion-nuevo')">✨ Crear / Editar Proyecto</button>
        </div>

        <div id="opcion-cargar" class="seccion-admin">
            <h2>📂 Cargar Capítulo</h2>
            <select id="select-cargar"></select>
            <input type="number" placeholder="Número de Capítulo">
            <input type="file" multiple>
            <button class="btn-guardar">Publicar Capítulo</button>
        </div>
        
        <div id="opcion-estatus" class="seccion-admin">
            <h2>🔄 Actualizar Estatus</h2>
            <select id="select-estatus" onchange="verEstatus()"></select>
            <label>Estado Actual</label>
            <div id="estado-actual" style="padding:10px; font-weight:bold; color:#d81b60;"></div>
            <select id="nuevo-estado">
                <option value="emision">🔴 En Emisión</option>
                <option value="hiatus">🟡 En Hiatus</option>
                <option value="finalizado">💖 Finalizado</option>
            </select>
            <button class="btn-guardar">Guardar Estatus</button>
        </div>

        <div id="opcion-nuevo" class="seccion-admin">
            <h2>✨ Crear / Editar Proyecto</h2>
            <input type="text" id="nuevo-id" placeholder="ID corto">
            <input type="text" id="nuevo-nombre" placeholder="Nombre largo">
            <textarea id="nuevo-sinopsis" placeholder="Sinopsis"></textarea>
            <button class="btn-guardar">Crear Proyecto</button>
            <hr><br>
            <label>Editar Proyecto</label>
            <select id="select-editar"></select>
            <input type="file" id="input-portada">
            <button class="btn-guardar">Cambiar Portada</button>
        </div>
    </div>

    <script>
        function verificarClave() {
            if(document.getElementById("clave-input").value === "Rose2026") {
                document.getElementById("bloque-login").style.display = "none";
                document.getElementById("contenido-panel").style.display = "flex";
                llenarSelects();
            } else { alert("Contraseña incorrecta"); }
        }

        const MAPA = {
            "confesion": "Confesión",
            "amigos": "Los amigos no hacen esto",
            "embarazada": "Fingí estar embarazada pero mi marido regresó",
            "leopardo": "La pequeña bebé leopardo de las nieves de la familia panteras negras",
            "Lobo": "Soy un lobo pero no te lastimaré",
            "Salvada": "Salvada por la pequeña dama sin poderes",
            "hermana": "Mi hermana que era mi enemiga ahora me ama",
            "matrimonio": "Matrimonio de conveniencia a una obsesión",
            "princesa": "¡No solo encante a la princesa!",
            "guarderia": "La guardería de la villana"
        };

        function llenarSelects() {
            ["select-cargar", "select-estatus", "select-editar"].forEach(id => {
                let s = document.getElementById(id);
                for(let [k, v] of Object.entries(MAPA)) {
                    let o = document.createElement("option");
                    o.value = k; o.textContent = v;
                    s.appendChild(o);
                }
            });
        }

        function abrirSeccion(id) {
            document.querySelectorAll('.seccion-admin').forEach(s => s.classList.remove('activa'));
            document.getElementById(id).classList.add('activa');
        }

        function verEstatus() {
            document.getElementById("estado-actual").textContent = "En Emisión"; // Aquí pondrás la lectura de Firebase
        }
    </script>
</body>
</html>
