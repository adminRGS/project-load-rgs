<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Rose Garden Scan</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <style>
        :root { color-scheme: light !important; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #ffeef4 !important; color: #4a1525 !important; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        h1 { color: #d81b60 !important; text-align: center; font-family: 'Georgia', serif; margin-bottom: 25px; font-size: 1.8rem; }
        #bloque-login { background: #ffffff !important; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(216, 27, 96, 0.15); border: 2px solid #f48fb1 !important; text-align: center; max-width: 340px; width: 100%; box-sizing: border-box; margin-top: 40px; }
        #contenido-panel { display: none; width: 100%; max-width: 500px; flex-direction: column; align-items: center; }
        .menu-administracion { display: flex; flex-direction: column; gap: 12px; width: 100%; margin-bottom: 30px; }
        .btn-menu { width: 100%; padding: 16px; background: #ffffff !important; border: 2px solid #f48fb1 !important; color: #d81b60 !important; border-radius: 14px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: all 0.3s ease; text-align: center; box-sizing: border-box; }
        .btn-menu:hover, .btn-menu.activo { background: #f48fb1 !important; color: white !important; box-shadow: 0 5px 15px rgba(244, 139, 177, 0.4); transform: translateY(-2px); }
        .seccion-admin { display: none; width: 100%; background: #ffffff !important; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(216, 27, 96, 0.1); border: 2px solid #f48fb1 !important; box-sizing: border-box; margin-bottom: 30px; }
        .seccion-admin.activa { display: block; }
        .seccion-admin h2 { color: #d81b60 !important; margin-top: 0; font-size: 1.4rem; border-bottom: 2px dashed #fde4ec; padding-bottom: 10px; }
        .grupo-control { margin-bottom: 18px; display: flex; flex-direction: column; gap: 8px; }
        label { font-weight: bold; color: #ad1457 !important; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px; }
        input, select, textarea { padding: 14px; background: #fff5f8 !important; border: 2px solid #fbc4b6 !important; color: #4a1525 !important; border-radius: 12px; font-size: 1rem; outline: none; width: 100%; box-sizing: border-box; }
        .btn-guardar { background: #ec407a !important; color: white !important; border: none; padding: 15px; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 1rem; width: 100%; }
        #caja-estado-actual { background: #fff5f8; border: 2px solid #fbc4b6; border-radius: 12px; padding: 14px; margin-bottom: 18px; display: flex; align-items: center; gap: 10px; font-size: 1rem; font-weight: bold; color: #4a1525; min-height: 48px; }
        .badge { padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; text-transform: uppercase; }
        .badge-emision { background: #4caf50; color: white; }
        .badge-hiatus { background: #ffd700; color: black; }
        .badge-finalizado { background: #ff66b2; color: white; }
    </style>
</head>
<body>
    <h1>🌸 Panel de Control - Rose Garden Scan 🌸</h1>
    <div id="bloque-login">
        <h2 style="color:#d81b60;">🌸 Acceso Administrativo</h2>
        <div class="grupo-control">
            <label>Contraseña</label>
            <input type="password" id="clave-input">
        </div>
        <button class="btn-guardar" onclick="verificarClave()">Entrar</button>
    </div>

    <div id="contenido-panel">
        <div class="menu-administracion">
            <button class="btn-menu" onclick="abrirSeccion(event,'opcion-cargar')">📂 Cargar Capítulo</button>
            <button class="btn-menu" onclick="abrirSeccion(event,'opcion-estatus')">🔄 Actualizar Estatus</button>
            <button class="btn-menu" onclick="abrirSeccion(event,'opcion-nuevo')">✨ Crear / Editar Proyecto</button>
        </div>

        <div id="opcion-cargar" class="seccion-admin">
            <h2>📂 Cargar Capítulo</h2>
            <div class="grupo-control">
                <label>Proyecto</label>
                <select id="select-proyecto-capitulo"><option value="">Cargando proyectos...</option></select>
            </div>
            <div class="grupo-control">
                <label>Número Capítulo</label>
                <input type="number" id="num-capitulo" step="any">
            </div>
            <div class="grupo-control">
                <label>Imágenes (Opcional: Subida a GitHub)</label>
                <input type="file" id="input-imgs" multiple accept="image/*">
            </div>
            <button class="btn-guardar" onclick="procesarSubidaGitHub()">Subir a GitHub y Publicar</button>
            <div class="grupo-control" style="margin-top:20px;">
                <label>Imágenes (Links de Drive)</label>
                <textarea id="enlaces-imagenes" rows="4"></textarea>
            </div>
            <button class="btn-guardar" onclick="subirCapitulo()">Publicar solo con Links</button>
        </div>

        <div id="opcion-estatus" class="seccion-admin">
            <h2>🔄 Actualizar Estatus</h2>
            <div class="grupo-control">
                <label>Selecciona la historia</label>
                <select id="select-proyecto-estatus" onchange="cargarEstadoActual()"></select>
            </div>
            <div class="grupo-control">
                <label>Estado actual</label>
                <div id="caja-estado-actual"><span>Selecciona una historia arriba</span></div>
            </div>
            <div class="grupo-control">
                <label>Cambiar a</label>
                <select id="nuevo-estado-valor">
                    <option value="emision">🔴 En Emisión</option>
                    <option value="hiatus">🟡 En Hiatus</option>
                    <option value="finalizado">💖 Finalizado</option>
                </select>
            </div>
            <button class="btn-guardar" onclick="actualizarEstadoFirebase()">💾 Guardar Estado</button>
        </div>

        <div id="opcion-nuevo" class="seccion-admin">
            <h2>✨ Crear / Editar Proyecto</h2>
            <div class="grupo-control">
                <label>ID / Nombre / Portada / Sinopsis</label>
                <input type="text" id="nuevo-id" placeholder="ID">
                <input type="text" id="nuevo-titulo" placeholder="Nombre">
                <input type="text" id="nuevo-portada" placeholder="Link Portada">
                <textarea id="nuevo-sinopsis" placeholder="Sinopsis"></textarea>
            </div>
            <button class="btn-guardar" onclick="crearNuevoProyecto()">Guardar Proyecto</button>
            <hr>
            <div class="grupo-control">
                <label>Editar Proyecto</label>
                <select id="select-proyecto-editar" onchange="cargarPortadaActualEditar()"></select>
            </div>
            <div class="grupo-control">
                <label>Editar Portada / Sinopsis</label>
                <input type="text" id="editar-portada">
                <textarea id="editar-sinopsis"></textarea>
            </div>
            <button class="btn-guardar" onclick="guardarEdicionProyecto()">Guardar Cambios</button>
        </div>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyBvTN_fjSZgGcEaraGeWSrnyUci_gsJ9cs", authDomain: "prgs-f2ef8.firebaseapp.com", projectId: "prgs-f2ef8", storageBucket: "prgs-f2ef8.firebasestorage.app", appId: "1:639472415083:web:2940245a8a70ed6c88dc2e" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // TU TOKEN VA AQUÍ:
        const GITHUB_TOKEN = "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"; 
        const GITHUB_REPO = "adminGRS/RoseGardenAdmin";

        // FUNCIONES NUEVAS GITHUB
        async function subirAGitHub(file, path) {
            const reader = new FileReader();
            return new Promise((resolve) => {
                reader.onloadend = async () => {
                    const base64 = reader.result.split(',')[1];
                    const res = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/${path}`, {
                        method: 'PUT',
                        headers: { Authorization: `token ${GITHUB_TOKEN}`, "Content-Type": "application/json" },
                        body: JSON.stringify({ message: "Upload", content: base64 })
                    });
                    const data = await res.json();
                    resolve(data.content.download_url);
                };
                reader.readAsDataURL(file);
            });
        }

        async function procesarSubidaGitHub() {
            const proy = document.getElementById("select-proyecto-capitulo").value;
            const cap = document.getElementById("num-capitulo").value;
            const files = document.getElementById("input-imgs").files;
            if(!proy || !cap || files.length === 0) return alert("Completa los datos");
            alert("Subiendo, no cierres la página...");
            let links = [];
            for (let i = 0; i < files.length; i++) {
                const url = await subirAGitHub(files[i], `${proy}/cap_${cap}/img_${i}.jpg`);
                links.push(url);
            }
            await db.collection(proy).doc("capitulo_" + cap).set({ numero: cap, imagenes: links, fecha: new Date() });
            alert("¡Publicado!");
        }

        // TU CÓDIGO ORIGINAL (MANTENIDO ÍNTEGRO)
        function verificarClave() { const clave = document.getElementById("clave-input").value; if (clave === "Rose2026") { document.getElementById("bloque-login").style.display = "none"; document.getElementById("contenido-panel").style.display = "flex"; cargarProyectosDesdeFirebase(); } else { alert("Contraseña incorrecta"); } }
        function abrirSeccion(event, id) { document.querySelectorAll('.seccion-admin').forEach(sec => sec.classList.remove('activa')); document.getElementById(id).classList.add('activa'); }
        function blindarEnlaceDrive(link) { if (!link) return ""; link = link.trim(); if (link.includes('uc?export=view')) return link; let id = ""; const matchD = link.match(/\/d\/([\w-]+)/); if (matchD && matchD[1]) id = matchD[1]; else { const matchId = link.match(/[?&]id=([\w-]+)/); if (matchId && matchId[1]) id = matchId[1]; } if (id) return `https://docs.google.com/uc?export=view&id=${id}`; return link; }
        function cargarProyectosDesdeFirebase() { const selects = [document.getElementById("select-proyecto-capitulo"), document.getElementById("select-proyecto-estatus"), document.getElementById("select-proyecto-editar")]; selects.forEach(select => select.innerHTML = '<option value="">-- Selecciona --</option>'); db.collection("estado_historias").orderBy("nombre").get().then(qs => { qs.forEach(doc => { const id = doc.id; const nombre = doc.data().nombre || id; selects.forEach(select => { const opt = document.createElement("option"); opt.value = id; opt.textContent = nombre; select.appendChild(opt); }); }); }); }
        function cargarEstadoActual() { const id = document.getElementById("select-proyecto-estatus").value; const caja = document.getElementById("caja-estado-actual"); if (!id) return; db.collection("estado_historias").doc(id).get().then(doc => { let estado = doc.exists && doc.data().estado ? doc.data().estado : "emision"; mostrarBadgeEstado(caja, estado); document.getElementById("nuevo-estado-valor").value = estado; }); }
        function mostrarBadgeEstado(caja, estado) { const etiquetas = { emision: { texto: "🔴 En Emisión", clase: "badge-emision" }, hiatus: { texto: "🟡 En Hiatus", clase: "badge-hiatus" }, finalizado: { texto: "💖 Finalizado", clase: "badge-finalizado" } }; const info = etiquetas[estado] || { texto: estado, clase: "badge-emision" }; caja.innerHTML = `<span class="badge ${info.clase}">${info.texto}</span>`; }
        function actualizarEstadoFirebase() { const id = document.getElementById("select-proyecto-estatus").value; const nuevoEstado = document.getElementById("nuevo-estado-valor").value; if (!id) return; db.collection("estado_historias").doc(id).set({ estado: nuevoEstado }, { merge: true }).then(() => alert("¡Estatus actualizado!")); }
        function subirCapitulo() { const proyecto = document.getElementById("select-proyecto-capitulo").value; const numero = document.getElementById("num-capitulo").value; const enlaces = document.getElementById("enlaces-imagenes").value.split("\n").filter(l => l.trim() !== "").map(l => blindarEnlaceDrive(l.trim())); if (!proyecto || !numero || enlaces.length === 0) { alert("Completa campos."); return; } db.collection(proyecto).doc("capitulo_" + numero).set({ numero: numero, imagenes: enlaces, fecha: new Date() }).then(() => { alert("¡Publicado!"); }); }
        function crearNuevoProyecto() { const id = document.getElementById("nuevo-id").value.trim(); const titulo = document.getElementById("nuevo-titulo").value.trim(); const portada = blindarEnlaceDrive(document.getElementById("nuevo-portada").value.trim()); const sinopsis = document.getElementById("nuevo-sinopsis").value.trim(); if (!id || !titulo) { alert("ID y Nombre son obligatorios."); return; } db.collection("estado_historias").doc(id).set({ nombre: titulo, portadaUrl: portada, sinopsis: sinopsis, estado: "emision" }, { merge: true }).then(() => { alert("¡Proyecto creado!"); cargarProyectosDesdeFirebase(); }); }
        function guardarEdicionProyecto() { const id = document.getElementById("select-proyecto-editar").value; const portada = blindarEnlaceDrive(document.getElementById("editar-portada").value.trim()); const sinopsis = document.getElementById("editar-sinopsis").value.trim(); if (!id) return; db.collection("estado_historias").doc(id).set({ portadaUrl: portada, sinopsis: sinopsis }, { merge: true }).then(() => alert("¡Cambios actualizados!")); }
        function cargarPortadaActualEditar() { const id = document.getElementById("select-proyecto-editar").value; if (!id) return; db.collection("estado_historias").doc(id).get().then(doc => { if (doc.exists) { const d = doc.data(); document.getElementById("editar-portada").value = d.portadaUrl || ""; document.getElementById("editar-sinopsis").value = d.sinopsis || ""; } }); }
    </script>
</body>
</html>
