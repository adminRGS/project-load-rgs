<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Rose Garden Scan</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        :root { color-scheme: light !important; }
        body { font-family: 'Segoe UI', sans-serif; background-color: #ffeef4 !important; color: #4a1525 !important; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        h1 { color: #d81b60 !important; text-align: center; font-family: 'Georgia', serif; margin-bottom: 25px; font-size: 1.8rem; }
        #bloque-login { background: #ffffff !important; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(216, 27, 96, 0.15); border: 2px solid #f48fb1 !important; text-align: center; max-width: 340px; width: 100%; box-sizing: border-box; margin-top: 40px; }
        #contenido-panel { display: none; width: 100%; max-width: 500px; flex-direction: column; align-items: center; }
        .menu-administracion { display: flex; flex-direction: column; gap: 12px; width: 100%; margin-bottom: 30px; }
        .btn-menu { width: 100%; padding: 16px; background: #ffffff !important; border: 2px solid #f48fb1 !important; color: #d81b60 !important; border-radius: 14px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: all 0.3s ease; text-align: center; }
        .btn-menu:hover, .btn-menu.activo { background: #f48fb1 !important; color: white !important; transform: translateY(-2px); }
        .seccion-admin { display: none; width: 100%; background: #ffffff !important; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(216, 27, 96, 0.1); border: 2px solid #f48fb1 !important; box-sizing: border-box; margin-bottom: 30px; }
        .seccion-admin.activa { display: block; }
        .grupo-control { margin-bottom: 18px; display: flex; flex-direction: column; gap: 8px; }
        label { font-weight: bold; color: #ad1457 !important; font-size: 0.85rem; text-transform: uppercase; }
        input, select, textarea { padding: 14px; background: #fff5f8 !important; border: 2px solid #fbc4b6 !important; color: #4a1525 !important; border-radius: 12px; font-size: 1rem; width: 100%; box-sizing: border-box; }
        .btn-guardar { background: #ec407a !important; color: white !important; border: none; padding: 15px; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 1rem; width: 100%; text-transform: uppercase; }
        .divisor { height: 2px; background: #fde4ec; margin: 25px 0; }
    </style>
</head>
<body>

    <h1>🌸 Panel de Control - Rose Garden Scan 🌸</h1>

    <div id="bloque-login">
        <h2 style="color: #d81b60; margin-top: 0;">🌸 Acceso Administrativo</h2>
        <div class="grupo-control">
            <label>Contraseña</label>
            <input type="password" id="clave-input" placeholder="••••••••" style="text-align: center;">
        </div>
        <button class="btn-guardar" onclick="verificarClave()">Entrar</button>
    </div>

    <div id="contenido-panel">
        <div class="menu-administracion">
            <button class="btn-menu" id="btn-cargar" onclick="abrirSeccion(event, 'opcion-cargar')">📂 Cargar Capítulo</button>
            <button class="btn-menu" id="btn-estatus" onclick="abrirSeccion(event, 'opcion-estatus')">🔄 Actualizar Estatus</button>
            <button class="btn-menu" id="btn-nuevo" onclick="abrirSeccion(event, 'opcion-nuevo')">✨ Crear / Editar Proyecto</button>
        </div>

        <div id="opcion-cargar" class="seccion-admin">
            <h2>📂 Cargar Capítulo</h2>
            <div class="grupo-control">
                <label>Proyecto</label>
                <select id="select-proyecto-capitulo"><option value="">Cargando...</option></select>
            </div>
            <div class="grupo-control">
                <label>Número del Capítulo</label>
                <input type="number" id="num-capitulo" step="any">
            </div>
            <div class="grupo-control">
                <label>Enlaces de Imágenes</label>
                <textarea id="enlaces-imagenes" rows="8" placeholder="Pega tus enlaces aquí..."></textarea>
            </div>
            <button class="btn-guardar" onclick="subirCapitulo()">Publicar Capítulo</button>
        </div>

        <div id="opcion-estatus" class="seccion-admin">
            <h2>🔄 Actualizar Estatus</h2>
            <div class="grupo-control">
                <label>Proyecto</label>
                <select id="select-proyecto-estatus" onchange="mostrarEstatusActual()"><option value="">Cargando...</option></select>
            </div>
            <div class="grupo-control">
                <label>Estatus Actual</label>
                <input type="text" id="estatus-actual-pantalla" readonly style="background-color: #f0f0f0 !important;">
            </div>
            <div class="grupo-control">
                <label>Nuevo Estatus</label>
                <select id="nuevo-estado-valor">
                    <option value="🔴 En Emisión">🔴 En Emisión</option>
                    <option value="🟡 En Hiatus">🟡 En Hiatus</option>
                    <option value="💖 Finalizado">💖 Finalizado</option>
                </select>
            </div>
            <button class="btn-guardar" onclick="actualizarEstadoFirebase()">Guardar Nuevo Estatus</button>
        </div>

        <div id="opcion-nuevo" class="seccion-admin">
            <h2>✨ Crear / Editar Proyecto</h2>
            <div class="grupo-control">
                <label>ID del Proyecto</label>
                <input type="text" id="nuevo-id">
            </div>
            <div class="grupo-control">
                <label>Nombre Completo</label>
                <input type="text" id="nuevo-titulo">
            </div>
            <div class="grupo-control">
                <label>Link Portada</label>
                <input type="text" id="nuevo-portada">
            </div>
            <div class="grupo-control">
                <label>Sinopsis</label>
                <textarea id="nuevo-sinopsis" rows="3"></textarea>
            </div>
            <button class="btn-guardar" onclick="crearNuevoProyecto()">Guardar Nuevo</button>

            <div class="divisor"></div>
            <h3>✏️ EDITAR EXISTENTE</h3>
            <div class="grupo-control">
                <label>Seleccionar Proyecto</label>
                <select id="select-proyecto-editar" onchange="cargarDatosParaEditar()"><option value="">Cargando...</option></select>
            </div>
            <div class="grupo-control">
                <label>Cambiar Portada</label>
                <input type="text" id="editar-portada">
            </div>
            <div class="grupo-control">
                <label>Cambiar Sinopsis</label>
                <textarea id="editar-sinopsis" rows="3"></textarea>
            </div>
            <button class="btn-guardar" style="background: #2575fc !important;" onclick="guardarEdicionProyecto()">Guardar Cambios de Edición</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBvTN_fjSZgGcEaraGeWSrnyUci_gsJ9cs",
            authDomain: "prgs-f2ef8.firebaseapp.com",
            projectId: "prgs-f2ef8",
            storageBucket: "prgs-f2ef8.firebasestorage.app",
            messagingSenderId: "639472415083",
            appId: "1:639472415083:web:2940245a8a70ed6c88dc2e"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let MAPA_PROYECTOS = [
            {id: "amigos", nombre: "Los amigos no hacen esto"},
            {id: "confesion", nombre: "Confesión"},
            {id: "embarazada", nombre: "Finge estar embarazada pero mi marido regresó"},
            {id: "guarderia", nombre: "La guardería de la villana"},
            {id: "hermana", nombre: "Mi hermana que era mi enemiga ahora me ama"},
            {id: "leopardo", nombre: "La pequeña leopardo de las nieves de la familia panteras negras"},
            {id: "princesa", nombre: "No solo encante a la princesa"},
            {id: "matrimonio", nombre: "Matrimonio de conveniencia a una obsesión"},
            {id: "lobo", nombre: "Soy un lobo pero no te lastimaré"},
            {id: "salvada", nombre: "Salvada por la pequeña dama sin poderes"}
        ];

        // --- FUNCIÓN MÁGICA: LIMPIA Y CONVIERTE CUALQUIER LINK ---
        function limpiarLink(url) {
            if (!url || typeof url !== 'string') return "";
            if (url.includes('firebasestorage.googleapis.com')) return url;
            if (url.includes('drive.google.com')) {
                let id = url.match(/\/d\/([^/]+)/) ? url.match(/\/d\/([^/]+)/)[1] : (url.match(/[?&]id=([^&]+)/) ? url.match(/[?&]id=([^&]+)/)[1] : null);
                return id ? `https://docs.google.com/uc?export=view&id=${id}` : url;
            }
            return url;
        }

        function verificarClave() {
            if (document.getElementById("clave-input").value === "Rose2026") {
                document.getElementById("bloque-login").style.display = "none";
                document.getElementById("contenido-panel").style.display = "flex";
                cargarProyectosEnSelects(); 
            } else alert("Contraseña incorrecta.");
        }

        function abrirSeccion(e, id) {
            document.querySelectorAll('.seccion-admin').forEach(s => s.classList.remove('activa'));
            document.querySelectorAll('.btn-menu').forEach(b => b.classList.remove('activo'));
            document.getElementById(id).classList.add('activa');
            e.target.classList.add('activo');
        }

        function cargarProyectosEnSelects() {
            const selects = ["select-proyecto-capitulo", "select-proyecto-estatus", "select-proyecto-editar"];
            selects.forEach(s => {
                const el = document.getElementById(s);
                el.innerHTML = '<option value="">-- Selecciona tu Proyecto --</option>';
                MAPA_PROYECTOS.forEach(p => {
                    let opc = document.createElement("option");
                    opc.value = p.id;
                    opc.text = p.nombre;
                    el.appendChild(opc);
                });
            });
        }

        function mostrarEstatusActual() {
            const id = document.getElementById("select-proyecto-estatus").value;
            if(!id) return;
            db.collection(id).doc("informacion_proyecto").get().then(doc => {
                document.getElementById("estatus-actual-pantalla").value = doc.exists ? (doc.data().estado || "🔴 En Emisión") : "🔴 En Emisión";
            });
        }

        function cargarDatosParaEditar() {
            const id = document.getElementById("select-proyecto-editar").value;
            if(!id) return;
            db.collection(id).doc("informacion_proyecto").get().then(doc => {
                if(doc.exists) {
                    document.getElementById("editar-portada").value = doc.data().portadaUrl || "";
                    document.getElementById("editar-sinopsis").value = doc.data().sinopsis || "";
                }
            });
        }

        function subirCapitulo() {
            const id = document.getElementById("select-proyecto-capitulo").value;
            const num = document.getElementById("num-capitulo").value.trim();
            if(!id || !num) { alert("Selecciona proyecto y capítulo."); return; }

            const bloques = document.getElementById("enlaces-imagenes").value.split(/[\n\s]+/);
            let imgs = bloques.filter(l => l.startsWith("http")).map(l => limpiarLink(l));

            if(imgs.length === 0) { alert("Agrega al menos un enlace válido."); return; }
            
            db.collection(id).doc("capitulo_" + num).set({ imagenes: imgs })
            .then(() => alert("¡Capítulo " + num + " publicado!"))
            .catch(e => alert("Error: " + e));
        }

        function actualizarEstadoFirebase() {
            const id = document.getElementById("select-proyecto-estatus").value;
            const estado = document.getElementById("nuevo-estado-valor").value;
            if(!id) return;
            db.collection(id).doc("informacion_proyecto").set({ estado }, { merge: true })
            .then(() => db.collection("proyectos_lista").doc(id).set({ estado }, { merge: true }))
            .then(() => alert("Estatus actualizado."))
            .catch(e => alert("Error: " + e));
        }

        function crearNuevoProyecto() {
            const id = document.getElementById("nuevo-id").value.trim();
            const titulo = document.getElementById("nuevo-titulo").value.trim();
            const portada = limpiarLink(document.getElementById("nuevo-portada").value.trim());
            const sinopsis = document.getElementById("nuevo-sinopsis").value.trim();

            if(!id || !titulo) { alert("Faltan campos obligatorios."); return; }

            db.collection(id).doc("informacion_proyecto").set({ nombre: titulo, portadaUrl: portada, sinopsis: sinopsis, estado: "🔴 En Emisión" })
            .then(() => db.collection("proyectos_lista").doc(id).set({ nombre: titulo, estado: "🔴 En Emisión", portadaUrl: portada }))
            .then(() => alert("Proyecto creado."))
            .catch(e => alert("Error: " + e));
        }

        function guardarEdicionProyecto() {
            const id = document.getElementById("select-proyecto-editar").value;
            if(!id) return;

            const portada = limpiarLink(document.getElementById("editar-portada").value.trim());
            const sinopsis = document.getElementById("editar-sinopsis").value.trim();

            db.collection(id).doc("informacion_proyecto").set({ portadaUrl: portada, sinopsis: sinopsis }, { merge: true })
            .then(() => db.collection("proyectos_lista").doc(id).set({ portadaUrl: portada }, { merge: true }))
            .then(() => alert("Cambios guardados correctamente."))
            .catch(e => alert("Error: " + e));
        }
    </script>
</body>
</html>
