<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rose Garden Scan Admin 2.0</title>

<style>
*{
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    margin:0;
    background:#ffe6ef;
    color:#5a2a3b;
}

header{
    background:#d94f8a;
    color:white;
    padding:20px;
    text-align:center;
    font-size:1.6rem;
    font-weight:bold;
}

.pantalla{
    display:none;
    padding:20px;
}

.activa{
    display:block;
}

.card{
    background:white;
    border-radius:20px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:15px;
    margin-top:10px;
    background:#e75480;
    color:white;
    font-size:1rem;
    font-weight:bold;
    cursor:pointer;
}

input,
textarea,
select{
    width:100%;
    padding:12px;
    border-radius:12px;
    border:1px solid #ccc;
    margin-top:10px;
    margin-bottom:10px;
}

textarea{
    min-height:120px;
}

.volver{
    background:#999;
}

/* LOGIN */
#login{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:#ffe6ef;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
}

.login-card{
    background:white;
    padding:30px;
    width:90%;
    max-width:350px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 4px 15px rgba(0,0,0,0.2);
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
    <div class="login-card">

        <h2>🌹 Rose Garden Scan</h2>

        <input
            type="password"
            id="clave"
            placeholder="Contraseña">

        <button onclick="entrar()">
            Entrar
        </button>

        <p id="mensajeLogin"
           style="color:red;"></p>

    </div>
</div>

<header>
🌹 Rose Garden Scan Admin 2.0
</header>

<!-- INICIO -->
<div id="inicio" class="pantalla activa">

    <div class="card">

        <button onclick="abrir('subir')">
            📚 Subir capítulo
        </button>

        <button onclick="abrir('editar')">
            📝 Editar historias
        </button>

        <button onclick="abrir('nueva')">
            ➕ Crear nueva historia
        </button>

        <button onclick="salir()">
            🚪 Cerrar sesión
        </button>

    </div>

</div>

<!-- SUBIR CAPITULO -->
<div id="subir" class="pantalla">

    <div class="card">

        <h2>📚 Subir capítulo</h2>

        <label>Historia</label>

        <select>
            <option>La pequeña bebé leopardo...</option>
            <option>Los amigos no hacen esto</option>
            <option>Mi hermana que era mi enemiga ahora me ama</option>
            <option>Salvada por la pequeña dama sin poderes</option>
            <option>Confesión</option>
            <option>Fingí estar embarazada pero mi marido regresó</option>
            <option>Soy un lobo pero no te lastimaré</option>
            <option>Matrimonio de conveniencia a una obsesión</option>
            <option>La guardería de la villana</option>
            <option>¡No, solo encanté a la princesa!</option>
        </select>

        <label>Capítulo</label>
        <input type="number">

        <label>Imágenes</label>
        <input type="file" multiple>

        <button>
            🚀 Publicar capítulo
        </button>

        <button class="volver"
                onclick="abrir('inicio')">
            ← Volver
        </button>

    </div>

</div>

<!-- EDITAR -->
<div id="editar" class="pantalla">

    <div class="card">

        <h2>📝 Editar historia</h2>

        <label>Historia</label>

        <select>
            <option>La pequeña bebé leopardo...</option>
            <option>Los amigos no hacen esto</option>
            <option>Mi hermana que era mi enemiga ahora me ama</option>
            <option>Salvada por la pequeña dama sin poderes</option>
            <option>Confesión</option>
            <option>Fingí estar embarazada pero mi marido regresó</option>
            <option>Soy un lobo pero no te lastimaré</option>
            <option>Matrimonio de conveniencia a una obsesión</option>
            <option>La guardería de la villana</option>
            <option>¡No, solo encanté a la princesa!</option>
        </select>

        <label>Nueva portada</label>
        <input type="file">

        <label>Sinopsis</label>
        <textarea></textarea>

        <label>Estado</label>

        <select>
            <option>En emisión</option>
            <option>Hiatus</option>
            <option>Finalizado</option>
        </select>

        <button>
            💾 Guardar cambios
        </button>

        <button class="volver"
                onclick="abrir('inicio')">
            ← Volver
        </button>

    </div>

</div>

<!-- NUEVA HISTORIA -->
<div id="nueva" class="pantalla">

    <div class="card">

        <h2>➕ Nueva historia</h2>

        <label>ID corto</label>
        <input type="text"
               placeholder="ej: leopardo">

        <label>Nombre largo</label>
        <input type="text">

        <label>Portada</label>
        <input type="file">

        <label>Sinopsis</label>
        <textarea></textarea>

        <label>Estado</label>

        <select>
            <option>En emisión</option>
            <option>Hiatus</option>
            <option>Finalizado</option>
        </select>

        <button>
            🌹 Crear historia
        </button>

        <button class="volver"
                onclick="abrir('inicio')">
            ← Volver
        </button>

    </div>

</div>

<script>
function abrir(id){

    document
        .querySelectorAll(".pantalla")
        .forEach(p=>{
            p.classList.remove("activa");
        });

    document
        .getElementById(id)
        .classList.add("activa");
}

function entrar(){

    const clave =
        document.getElementById("clave").value;

    if(clave === "Rose2026"){

        localStorage.setItem(
            "rose_admin",
            "ok"
        );

        document.getElementById("login")
            .style.display = "none";

    }else{

        document.getElementById(
            "mensajeLogin"
        ).innerText =
        "Contraseña incorrecta.";
    }
}

function salir(){

    localStorage.removeItem(
        "rose_admin"
    );

    location.reload();
}

window.onload = function(){

    if(
        localStorage.getItem(
            "rose_admin"
        )
    ){
        document.getElementById(
            "login"
        ).style.display = "none";
    }
}
</script>

</body>
</html>
