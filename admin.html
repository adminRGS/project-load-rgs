<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rose Garden Scan Admin</title>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<style>

*{
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    margin:0;
    background:#ffe6ef;
    color:#5a2a3b;
}

header{
    background:#d94f8a;
    color:white;
    padding:20px;
    text-align:center;
    font-size:1.5rem;
    font-weight:bold;
}

.pantalla{
    display:none;
    padding:20px;
}

.activa{
    display:block;
}

.card{
    background:white;
    border-radius:20px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:15px;
    margin-top:10px;
    background:#e75480;
    color:white;
    font-size:1rem;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    background:#aaa;
    cursor:not-allowed;
}

input,
select{
    width:100%;
    padding:12px;
    border-radius:12px;
    border:1px solid #ccc;
    margin-top:10px;
    margin-bottom:15px;
    font-size:1rem;
}

.volver{
    background:#999;
}

#login{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:#ffe6ef;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
}

.login-card{
    background:white;
    padding:30px;
    width:90%;
    max-width:350px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 4px 15px rgba(0,0,0,0.2);
}

.info-pdf{
    background:#fff0f6;
    border:1px solid #f3b3cd;
    border-radius:12px;
    padding:12px;
    margin-bottom:15px;
    font-size:0.9rem;
    line-height:1.5;
}

.mensaje{
    text-align:center;
    font-weight:bold;
    line-height:1.5;
    margin-top:15px;
}

</style>
</head>

<body>


<!-- =====================================================
     LOGIN
===================================================== -->

<div id="login">

    <div class="login-card">

        <h2>🌹 Rose Garden Scan</h2>

        <input
            type="password"
            id="clave"
            placeholder="Contraseña">

        <button onclick="entrar()">
            Entrar
        </button>

        <p id="mensajeLogin"
           style="color:red;">
        </p>

    </div>

</div>


<!-- =====================================================
     ENCABEZADO
===================================================== -->

<header>
    🌹 Rose Garden Scan Admin
</header>


<!-- =====================================================
     INICIO
===================================================== -->

<div id="inicio" class="pantalla activa">

    <div class="card">

        <button onclick="abrir('subir')">
            📚 Subir capítulo
        </button>

        <button onclick="salir()">
            🚪 Cerrar sesión
        </button>

    </div>

</div>


<!-- =====================================================
     SUBIR CAPÍTULO
===================================================== -->

<div id="subir" class="pantalla">

    <div class="card">

        <h2>📚 Subir capítulo</h2>


        <label>
            Historia
        </label>

        <select id="historia">

            <option value="leopardo">
                La pequeña bebé leopardo...
            </option>

            <option value="amigos">
                Los amigos no hacen esto
            </option>

            <option value="hermana">
                Mi hermana que era mi enemiga ahora me ama
            </option>

            <option value="salvada">
                Salvada por la pequeña dama sin poderes
            </option>

            <option value="confesion">
                Confesión
            </option>

            <option value="embarazada">
                Fingí estar embarazada pero mi marido regresó
            </option>

            <option value="lobo">
                Soy un lobo pero no te lastimaré
            </option>

            <option value="matrimonio">
                Matrimonio de conveniencia a una obsesión
            </option>

            <option value="guarderia">
                La guardería de la villana
            </option>

            <option value="princesa">
                ¡No, solo encanté a la princesa!
            </option>

        </select>


        <label>
            Número de capítulo
        </label>

        <input
            type="text"
            id="numeroCapitulo"
            placeholder="Ejemplo: 109 o 43.5">


        <label>
            Tipo de capítulo
        </label>

        <select id="tipoCapitulo">

            <option value="pdf">
                📄 PDF
            </option>

        </select>


        <label>
            🔗 Enlace del PDF
        </label>

        <input
            type="url"
            id="enlacePDF"
            placeholder="Pega aquí el enlace del PDF">


        <div class="info-pdf">

            📄 <strong>Importante:</strong>

            <br><br>

            El PDF debe estar configurado para que
            cualquier persona que tenga el enlace
            pueda verlo.

            <br><br>

            Puedes utilizar Google Drive.

        </div>


        <button
            id="btnPublicar"
            onclick="subirCapitulo()">

            🚀 Publicar capítulo

        </button>


        <p
            id="mensajeSubida"
            class="mensaje">
        </p>


        <button
            class="volver"
            onclick="abrir('inicio')">

            ← Volver

        </button>

    </div>

</div>


<script>

/* =====================================================
   FIREBASE
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyBvTN_fjSZgGcEaraGeWSrnyUci_gs9",

    authDomain:
        "prgs-f2ef8.firebaseapp.com",

    projectId:
        "prgs-f2ef8",

    storageBucket:
        "prgs-f2ef8.firebasestorage.app",

    messagingSenderId:
        "639472415083",

    appId:
        "1:639472415083:web:2940245a8a70ed6c88dc2e"

};


if(!firebase.apps.length){

    firebase.initializeApp(
        firebaseConfig
    );

}


const db =
    firebase.firestore();



/* =====================================================
   NAVEGACIÓN
===================================================== */

function abrir(id){

    document
        .querySelectorAll(".pantalla")
        .forEach(p => {

            p.classList.remove("activa");

        });


    document
        .getElementById(id)
        .classList.add("activa");

}



/* =====================================================
   LOGIN
===================================================== */

function entrar(){

    const clave =
        document
        .getElementById("clave")
        .value;


    if(clave === "Rose2026"){

        localStorage.setItem(
            "rose_admin",
            "ok"
        );


        document
            .getElementById("login")
            .style.display = "none";


    }else{

        document
            .getElementById("mensajeLogin")
            .innerText =
            "Contraseña incorrecta.";

    }

}



/* =====================================================
   CERRAR SESIÓN
===================================================== */

function salir(){

    localStorage.removeItem(
        "rose_admin"
    );

    location.reload();

}



/* =====================================================
   COMPROBAR SESIÓN
===================================================== */

window.onload = function(){

    if(
        localStorage.getItem(
            "rose_admin"
        )
    ){

        document
            .getElementById("login")
            .style.display = "none";

    }

};



/* =====================================================
   SUBIR CAPÍTULO PDF
===================================================== */

async function subirCapitulo(){

    const historia =
        document
        .getElementById("historia")
        .value;


    const numero =
        document
        .getElementById("numeroCapitulo")
        .value
        .trim();


    const enlacePDF =
        document
        .getElementById("enlacePDF")
        .value
        .trim();


    const boton =
        document
        .getElementById("btnPublicar");


    const mensaje =
        document
        .getElementById("mensajeSubida");



    /* -----------------------------------------
       VALIDAR NÚMERO
    ----------------------------------------- */

    if(!numero){

        mensaje.style.color =
            "#d00000";

        mensaje.innerText =
            "❌ Ingresa el número del capítulo.";

        return;

    }



    /* -----------------------------------------
       VALIDAR ENLACE
    ----------------------------------------- */

    if(!enlacePDF){

        mensaje.style.color =
            "#d00000";

        mensaje.innerText =
            "❌ Pega el enlace del PDF.";

        return;

    }



    if(
        !enlacePDF.startsWith("http://") &&
        !enlacePDF.startsWith("https://")
    ){

        mensaje.style.color =
            "#d00000";

        mensaje.innerText =
            "❌ El enlace debe comenzar con https://";

        return;

    }



    /* -----------------------------------------
       BLOQUEAR BOTÓN
    ----------------------------------------- */

    boton.disabled = true;

    boton.innerText =
        "⏳ Guardando...";


    mensaje.style.color =
        "#5a2a3b";

    mensaje.innerText =
        "✨ Guardando capítulo en Firebase...";



    try{

        const idDocumento =
            "capitulo_" + numero;



        /* -----------------------------------------
           GUARDAR EN FIREBASE
        ----------------------------------------- */

        await db
            .collection(historia)
            .doc(idDocumento)
            .set({

                pdf: enlacePDF,

                loves: 0,

                likes: 0,

                haha: 0

            },{

                merge:true

            });



        /* -----------------------------------------
           ÉXITO
        ----------------------------------------- */

        mensaje.style.color =
            "#188038";

        mensaje.innerText =
            "✅ ¡Capítulo guardado correctamente en Firebase!";


        console.log(
            "CAPÍTULO GUARDADO"
        );


        console.log(
            "Historia:",
            historia
        );


        console.log(
            "Documento:",
            idDocumento
        );


        console.log(
            "PDF:",
            enlacePDF
        );



        /* -----------------------------------------
           LIMPIAR CAMPOS
        ----------------------------------------- */

        document
            .getElementById("numeroCapitulo")
            .value = "";


        document
            .getElementById("enlacePDF")
            .value = "";



    }catch(error){

        console.error(
            "Error guardando capítulo:",
            error
        );


        mensaje.style.color =
            "#d00000";


        mensaje.innerText =
            "❌ No se pudo guardar el capítulo en Firebase.";

    }



    /* -----------------------------------------
       RESTAURAR BOTÓN
    ----------------------------------------- */

    boton.disabled = false;

    boton.innerText =
        "🚀 Publicar capítulo";

}

</script>

</body>
</html>
