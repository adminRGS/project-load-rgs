<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel Admin - Rose Garden</title>
    <style>
        body { font-family: sans-serif; background: #ffeef4; color: #4a1525; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; margin: 0; padding: 20px; }
        #login-screen, #admin-panel { text-align: center; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(216, 27, 96, 0.15); border: 2px solid #f48fb1; width: 90%; max-width: 450px; }
        #admin-panel { display: none; }
        h1 { color: #d81b60; font-size: 1.5rem; margin-bottom: 20px; }
        .menu-tabs { display: flex; gap: 5px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 10px; background: #fce4ec; border: none; border-radius: 8px; cursor: pointer; color: #d81b60; font-weight: bold; }
        .tab-btn.active { background: #f48fb1; color: white; }
        .section { display: none; }
        .section.active { display: block; }
        label { display: block; margin-top: 15px; color: #d81b60; font-size: 0.8rem; font-weight: bold; text-transform: uppercase; text-align: left; }
        select, input, textarea { width: 100%; padding: 12px; margin-top: 5px; border-radius: 10px; border: 2px solid #fbc4b6; background: #fff5f8; color: #4a1525; box-sizing: border-box; }
        button { width: 100%; padding: 15px; margin-top: 20px; background: #ec407a; border: none; border-radius: 10px; color: white; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div id="login-screen">
    <h2>Panel de Control</h2>
    <input type="password" id="passInput" placeholder="Contraseña...">
    <button onclick="verificarClave()">Entrar</button>
</div>

<div id="admin-panel">
    <h1>🌸 Panel Administrativo</h1>
    <div class="menu-tabs">
        <button class="tab-btn active" onclick="showSection('cargar', this)">Cargar</button>
        <button class="tab-btn" onclick="showSection('estatus', this)">Estatus</button>
        <button class="tab-btn" onclick="showSection('info', this)">Info</button>
    </div>

    <div id="cargar" class="section active">
        <select id="historiaID">
            <option value="guarderia">La guardería de la villana</option>
            <option value="confesion">Confesión</option>
            <option value="embarazada">Fingí estar embarazada...</option>
            <option value="salvada">Salvada por la pequeña dama...</option>
            <option value="leopardo">La pequeña leopardo de las nieves...</option>
            <option value="lobo">Soy un lobo pero no te lastimaré</option>
            <option value="princesa">No solo encanté a la princesa</option>
            <option value="matrimonio">Matrimonio de conveniencia...</option>
            <option value="amigos">Los amigos no hacen esto</option>
            <option value="hermana">Mi hermana ahora me ama</option>
        </select>
        <input type="number" id="capNum" step="any" placeholder="Capítulo (Ej: 65 o 14.5)">
        <textarea id="linksRaw" placeholder="Pega links aquí..."></textarea>
        <button onclick="guardarCapitulo()">🚀 Guardar Capítulo</button>
    </div>

    <div id="estatus" class="section">
        <label>Seleccionar Historia</label>
        <select id="estatusID"></select>
        <select id="nuevoEstatus">
            <option value="emision">En Emisión</option>
            <option value="hiatus">En Hiatus</option>
            <option value="finalizado">Finalizado</option>
        </select>
        <button onclick="updateEstado()">Actualizar Estatus</button>
    </div>

    <div id="info" class="section">
        <label>Seleccionar Historia</label>
        <select id="infoID"></select>
        <input type="text" id="portadaURL" placeholder="Link de Portada">
        <textarea id="sinopsis" placeholder="Sinopsis"></textarea>
        <button onclick="updateInfo()">Guardar Cambios</button>
    </div>
    <p id="status" style="margin-top:20px; font-weight: bold; text-align: center;"></p>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const db = getFirestore(initializeApp({
        apiKey: "AIzaSyBvTN_fjSZgGcEaraGeWSrnyUci_gsJ9cs",
        projectId: "prgs-f2ef8",
        storageBucket: "prgs-f2ef8.firebasestorage.app"
    }));

    window.verificarClave = () => {
        if(document.getElementById('passInput').value === "Rose2026") {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('admin-panel').style.display = 'block';
        } else alert("Contraseña incorrecta.");
    }

    window.guardarCapitulo = async () => {
        const id = document.getElementById('historiaID').value;
        const num = document.getElementById('capNum').value;
        const rawText = document.getElementById('linksRaw').value;
        
        let linksLimpios = rawText.split('\n').filter(l => l.trim()).map(l => {
            const idMatch = l.match(/[-\w]{25,}/);
            return idMatch ? `https://lh3.googleusercontent.com/d/${idMatch[0]}=s1600` : null;
        }).filter(l => l);

        try {
            await setDoc(doc(db, id, "capitulo_" + num), { imagenes: linksLimpios });
            alert("✅ ¡Capítulo guardado exitosamente!");
            document.getElementById('capNum').value = "";
            document.getElementById('linksRaw').value = "";
        } catch (e) { alert("Error: " + e.message); }
    }

    window.showSection = (id, btn) => {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        btn.classList.add('active');
    }

    window.updateEstado = async () => alert("Estado actualizado");
    window.updateInfo = async () => alert("Información guardada");
</script>
</body>
</html>
