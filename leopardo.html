<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La pequeña leopardo de las nieves - Rose Garden Scan</title>
    <link rel="stylesheet" href="estilos-rose.css">
</head>
<body>

    <div class="contenedor-regreso">
        <a href="historias.html" class="btn-catalogo">🏠 Volver a Historias</a>
    </div>

    <div class="contenedor-manga">
        <div class="portada-box">
            <img src="leopardo.jpg" id="portada-dinamica" onerror="this.src='portada-defecto.jpg';">
        </div>
        
        <h1 id="titulo-proyecto" class="titulo-manga">La pequeña leopardo de las nieves</h1>
        
        <p class="sinopsis-texto" id="sinopsis-dinamica">Cargando...</p>

        <div class="seccion-titulo">Capítulos Disponibles</div>
        <div class="grid-caps" id="grid"></div>
    </div>

    <div id="lector">
        </div>

    <script src="funciones-rose.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        
        // ... (Tu configuración de Firebase aquí) ...
        const db = getFirestore(initializeApp({ /* tus datos */ }));
        const historiaID = "leopardo";

        // IMPORTANTE: Esta es la función que arregla tus links
        window.arreglarLink = (url) => {
            if (!url) return "";
            if (url.includes('drive.google.com')) {
                let id = url.includes('id=') ? url.split('id=')[1].split('&')[0] : url.split('/d/')[1].split('/')[0];
                return `https://docs.google.com/uc?export=view&id=${id}`;
            }
            return url;
        };

        // Esta función carga la info desde Firebase
        async function cargar() {
            const snap = await getDoc(doc(db, historiaID, "informacion_proyecto"));
            if (snap.exists()) {
                document.getElementById('sinopsis-dinamica').innerText = snap.data().sinopsis;
            }
            // ... (resto de tu carga de capítulos)
        }
        cargar();
    </script>
</body>
</html>
