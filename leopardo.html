<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La pequeña leopardo de las nieves - Rose Garden Scan</title>
    <link rel="stylesheet" href="estilos-rose.css">
    <style>
        /* TUS ESTILOS ORIGINALES RECUPERADOS */
        body { margin: 0; padding: 0; background: #000; color: #fff; font-family: sans-serif; }
        .contenedor-regreso { padding: 20px; }
        .btn-catalogo { color: #ff66b2; text-decoration: none; border: 1px solid #ff66b2; padding: 5px 10px; border-radius: 5px; }
        .contenedor-manga { display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .portada-box { width: 200px; height: 300px; border: 2px solid #ff66b2; margin-bottom: 20px; }
        .portada-box img { width: 100%; height: 100%; object-fit: cover; }
        .titulo-manga { color: #ff66b2; margin: 10px 0; }
        .sinopsis-texto { max-width: 600px; text-align: center; color: #ccc; margin-bottom: 20px; }
        .seccion-titulo { font-weight: bold; margin-bottom: 15px; color: #ff66b2; }
        .grid-caps { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 10px; width: 100%; max-width: 600px; }
        .cap-btn-dinamico { border: 1px solid #ff66b2; padding: 10px; text-align: center; cursor: pointer; border-radius: 5px; }
        
        #lector { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 1000; overflow-y: scroll; }
        .nav-lector { position: fixed; bottom: 10px; left: 10px; background: #222; padding: 10px; display: flex; gap: 10px; z-index: 1001; }
        #contenido-imagenes img { width: 100%; display: block; }
        .btn-cerrar { cursor: pointer; }
    </style>
</head>
<body>

    <div class="contenedor-regreso">
        <a href="historias.html" class="btn-catalogo">🏠 Volver a Historias</a>
    </div>

    <div class="contenedor-manga">
        <div class="portada-box">
            <img src="leopardo.jpg" id="portada-dinamica" onerror="this.src='portada-defecto.jpg';">
        </div>
        <h1 id="titulo-proyecto" class="titulo-manga">La pequeña leopardo de las nieves</h1>
        <p class="sinopsis-texto" id="sinopsis-dinamica">Cargando sinopsis...</p>
        <div class="seccion-titulo">Capítulos Disponibles</div>
        <div class="grid-caps" id="grid"></div>
    </div>

    <div id="lector">
        <div class="nav-lector">
            <button id="btn-ant" class="nav-btn">← Ant.</button>
            <button id="btn-sig" class="nav-btn">Sig. →</button>
            <button class="btn-cerrar" onclick="cerrarLector()">✕</button>
        </div>
        <div id="contenido-imagenes"></div>
    </div>

    <script src="funciones-rose.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { /* ... (Tus datos de firebase) ... */ };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        // ESTA ES LA ÚNICA MODIFICACIÓN: Arregla el link de Drive correctamente
        window.arreglarLink = function(url) {
            if (!url) return "";
            if (url.includes('drive.google.com')) {
                let id = url.includes('id=') ? url.split('id=')[1].split('&')[0] : url.split('/d/')[1].split('/')[0];
                return `https://drive.google.com/uc?export=view&id=${id}`;
            }
            return url;
        };

        // Tu lógica original de carga se mantiene íntegra
        async function init() {
            // Conectar portada y sinopsis
            const snap = await getDoc(doc(db, "leopardo", "informacion_proyecto"));
            if (snap.exists()) {
                const data = snap.data();
                document.getElementById('sinopsis-dinamica').innerText = data.sinopsis;
                document.getElementById('portada-dinamica').src = window.arreglarLink(data.portadaUrl);
            }
            
            // Cargar capítulos
            const querySnapshot = await getDocs(collection(db, "leopardo"));
            const grid = document.getElementById('grid');
            querySnapshot.forEach(docSnap => {
                if (docSnap.id.startsWith("capitulo_")) {
                    const btn = document.createElement('div');
                    btn.className = 'cap-btn-dinamico';
                    btn.innerText = docSnap.id.replace("capitulo_", "");
                    btn.onclick = () => abrirLector(docSnap.id);
                    grid.appendChild(btn);
                }
            });
        }

        window.abrirLector = async function(idCap) {
            const snap = await getDoc(doc(db, "leopardo", idCap));
            if (snap.exists()) {
                const imgs = snap.data().imagenes;
                const container = document.getElementById('contenido-imagenes');
                container.innerHTML = "";
                imgs.forEach(url => {
                    const img = document.createElement('img');
                    img.src = window.arreglarLink(url);
                    container.appendChild(img);
                });
                document.getElementById('lector').style.display = 'block';
            }
        };

        window.cerrarLector = () => { document.getElementById('lector').style.display = 'none'; };
        init();
    </script>
</body>
</html>
