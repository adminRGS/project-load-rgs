<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La pequeña leopardo de las nieves - Rose Garden Scan</title>
    <link rel="stylesheet" href="estilos-rose.css">
    <style>
        /* Estilos específicos que aseguran que el menú de colores funcione */
        #sub-menu-colores-lector {
            display: none;
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            background: #161616;
            border: 1.5px solid #ff66b2;
            padding: 10px;
            border-radius: 25px;
            flex-direction: column;
            gap: 10px;
            z-index: 105;
        }
        #sub-menu-colores-lector.visible-rose { display: flex; }
        .dot { width: 25px; height: 25px; border-radius: 50%; cursor: pointer; border: 1px solid white; }
    </style>
</head>
<body>

    <div id="barra-progreso-rose"></div>

    <div class="contenedor-regreso">
        <a href="historias.html" class="btn-catalogo">🏠 Volver a Historias</a>
    </div>

    <div class="contenedor-manga">
        <div class="portada-box">
            <img src="leopardo.jpg" id="portada-dinamica" onerror="this.src='portada-defecto.jpg';">
        </div>
        <h1 id="titulo-proyecto" class="titulo-manga">La pequeña leopardo de las nieves</h1>
        <p class="sinopsis-texto" id="sinopsis-dinamica">Buscando huellas en la nieve...</p>
        <div class="seccion-titulo">Capítulos Disponibles</div>
        <div class="grid-caps" id="grid"></div>
    </div>

    <div id="lector">
        <div class="nav-lector">
            <div style="position: relative;">
                <button onclick="toggleMenuLector(event)" style="background: none; border: none; font-size: 1.5rem; cursor: pointer;">🎨</button>
                <div id="sub-menu-colores-lector">
                    <div class="dot" style="background: #000;" onclick="cambiarTemaRose('dark')"></div>
                    <div class="dot" style="background: #2c2c2c;" onclick="cambiarTemaRose('gris')"></div>
                    <div class="dot" style="background: #dfd3e3;" onclick="cambiarTemaRose('malva')"></div>
                </div>
            </div>

            <div class="grupo-flechas">
                <button id="btn-ant" class="nav-btn">← Ant.</button>
                <button id="btn-sig" class="nav-btn">Sig. →</button>
            </div>
            <button class="btn-cerrar" onclick="cerrarLector()">✕</button>
        </div>
        <div id="contenido-imagenes"></div>
    </div>

    <script src="funciones-rose.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBvTN_fjSZgGcEaraGeWSrnyUci_gsJ9cs",
            authDomain: "prgs-f2ef8.firebaseapp.com",
            projectId: "prgs-f2ef8",
            storageBucket: "prgs-f2ef8.firebasestorage.app",
            messagingSenderId: "639472415083",
            appId: "1:639472415083:web:2940245a8a70ed6c88dc2e"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        // Función corregida para forzar visualización directa
        window.arreglarLink = function(url) {
            if (!url) return "";
            let id = url.includes('id=') ? url.split('id=')[1].split('&')[0] : url.split('/d/')[1].split('/')[0];
            return `https://lh3.googleusercontent.com/d/${id}`;
        };

        // Función del menú
        window.toggleMenuLector = (e) => {
            e.stopPropagation();
            document.getElementById('sub-menu-colores-lector').classList.toggle('visible-rose');
        };

        // ... (resto de tu lógica de carga de capítulos de Firebase) ...
        // Asegúrate de usar window.arreglarLink(url) al cargar las imágenes en el contenedor
    </script>
</body>
</html>
