<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La pequeña leopardo de las nieves - Rose Garden Scan</title>
    
    <link rel="stylesheet" href="estilos-rose.css">

    <style>
        /* MANTENGO TUS ESTILOS ORIGINALES INTACTOS */
        body { 
            margin: 0; padding: 0; 
            background: var(--fondo-rose, radial-gradient(circle at center, #1a0a1a 0%, #050505 100%)); 
            color: var(--texto-rose, white); font-family: 'serif'; 
            display: flex; flex-direction: column; align-items: center; 
            overflow-x: hidden; min-height: 100vh; 
            transition: background 0.3s ease;
        }
        
        body::after {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(circle, #fff 1px, transparent 1px), radial-gradient(circle, #fff 1.5px, transparent 1.5px);
            background-size: 80px 80px, 150px 150px;
            opacity: 0.2;
            animation: moveStars 30s linear infinite;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes moveStars { from { transform: translateY(0); } to { transform: translateY(-150px); } }

        .contenedor-manga { width: 90%; max-width: 600px; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 20px 10px; z-index: 10; }
        .contenedor-regreso { width: 100%; padding: 20px; display: flex; justify-content: flex-start; box-sizing: border-box; z-index: 10; }
        .btn-catalogo { text-decoration: none; color: #ff66b2; border: 2px solid #ff66b2; padding: 10px 22px; border-radius: 30px; font-weight: bold; font-size: 0.95rem; transition: 0.3s; display: flex; align-items: center; gap: 10px; background: rgba(255, 102, 178, 0.1); backdrop-filter: blur(8px); box-shadow: 0 4px 15px rgba(255, 102, 178, 0.2); }
        .btn-catalogo:hover { background: #ff66b2; color: white; transform: scale(1.05); }

        .portada-box { width: 220px; height: 310px; border-radius: 12px; border: 2px solid #ff66b2; box-shadow: 0 0 20px rgba(255, 102, 178, 0.4); background: #222; margin-bottom: 25px; overflow: hidden; }
        .portada-box img { width: 100%; height: 100%; object-fit: cover; }

        .titulo-manga { font-size: 2rem; color: #ff66b2; margin: 10px 0 15px 0; font-family: 'Georgia', serif; font-weight: bold; line-height: 1.3; background: linear-gradient(90deg, #ff66b2, #ffd700, #ff66b2); background-size: 200% auto; -webkit-background-clip: text; color: transparent; animation: shineText 4s linear infinite; }
        @keyframes shineText { to { background-position: 200% center; } }

        .sinopsis-texto { font-size: 0.95rem; line-height: 1.6; color: var(--texto-rose, rgba(255, 255, 255, 0.85)); margin: 0 0 30px 0; font-family: sans-serif; text-align: justify; text-align-last: center; }
        .seccion-titulo { width: 100%; max-width: 500px; margin: 20px 0 10px 0; font-size: 1.1rem; border-bottom: 2px solid #ff66b2; padding-bottom: 8px; color: #ff66b2; text-transform: uppercase; letter-spacing: 2px; font-weight: bold; }
        .grid-caps { display: grid; grid-template-columns: repeat(auto-fill, minmax(85px, 1fr)); gap: 15px; width: 100%; max-width: 500px; padding-bottom: 60px; margin-top: 15px; z-index: 10; }
        .cap-btn-dinamico { border: 1px solid #ff66b2; color: white; background: rgba(255, 102, 178, 0.15); text-align: center; padding: 20px 0; border-radius: 15px; font-weight: bold; transition: 0.4s ease; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
        .cap-btn-dinamico:hover { transform: translateY(-5px); box-shadow: 0 0 20px rgba(255, 102, 178, 0.6); background: rgba(255, 102, 178, 0.3); }

        #lector { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--fondo-rose, #000); z-index: 100; overflow-y: scroll; }
        #contenido-imagenes img { width: 100%; display: block; margin-bottom: -1px; }
        
        .nav-lector { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; background: var(--panel-rose, rgba(0, 0, 0, 0.96)); padding: 10px 20px; border-radius: 45px; border: 1.5px solid #ff66b2; backdrop-filter: blur(12px); z-index: 102; box-shadow: 0 0 35px rgba(255, 102, 178, 0.5); }
        .grupo-flechas { display: flex; gap: 8px; }
        .nav-btn { background: #ff66b2; color: white; border: none; padding: 10px 18px; border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 0.85rem; }
        .nav-btn:disabled { background: #333; opacity: 0.4; }
        .btn-cerrar { background: #ff4d4d; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; border: none; color: white; cursor: pointer; }
    </style>
</head>
<body>

    <div class="contenedor-regreso">
        <a href="historias.html" class="btn-catalogo">🏠 Volver a Historias</a>
    </div>

    <div class="contenedor-manga">
        <div class="portada-box">
            <img src="leopardo.jpg" id="portada-dinamica" onerror="this.src='portada-defecto.jpg';">
        </div>
        <h1 id="titulo-proyecto" class="titulo-manga">La pequeña leopardo de las nieves</h1>
        <p class="sinopsis-texto" id="sinopsis-dinamica">Buscando huellas en la nieve...</p>
        <div class="seccion-titulo">Capítulos Disponibles</div>
        <div class="grid-caps" id="grid"></div>
    </div>

    <div id="lector">
        <div class="nav-lector">
            <div class="grupo-flechas">
                <button id="btn-ant" class="nav-btn">← Ant.</button>
                <button id="btn-sig" class="nav-btn">Sig. →</button>
            </div>
            <button class="btn-cerrar" onclick="cerrarLector()">✕</button>
        </div>
        <div id="contenido-imagenes"></div>
    </div>

<script src="funciones-rose.js"></script>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBvTN_fjSZgGcEaraGeWSrnyUci_gsJ9cs",
        authDomain: "prgs-f2ef8.firebaseapp.com",
        projectId: "prgs-f2ef8",
        storageBucket: "prgs-f2ef8.firebasestorage.app",
        messagingSenderId: "639472415083",
        appId: "1:639472415083:web:2940245a8a70ed6c88dc2e"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    
    // AQUÍ ESTÁ LA CORRECCIÓN PARA LOS LINKS DE DRIVE
    window.arreglarLink = function(url) {
        if (!url) return "";
        if (url.includes('drive.google.com')) {
            let id = url.includes('id=') ? url.split('id=')[1].split('&')[0] : url.split('/d/')[1].split('/')[0];
            return `https://drive.google.com/uc?export=view&id=${id}`;
        }
        return url;
    };

    // MANTENGO TU LÓGICA ORIGINAL PARA QUE TODO FUNCIONE COMO ANTES
    async function cargarProyectoDesdeFirebase() {
        const grid = document.getElementById('grid');
        const historiaID = "leopardo";
        try {
            const querySnapshot = await getDocs(collection(db, historiaID));
            let disponibles = [];
            querySnapshot.forEach((docSnap) => {
                if (docSnap.id.startsWith("capitulo_")) {
                    disponibles.push(docSnap.id.replace("capitulo_", ""));
                }
            });
            let capsOrdenados = disponibles.sort((a, b) => parseFloat(a) - parseFloat(b));
            grid.innerHTML = "";
            capsOrdenados.forEach(idCap => {
                const btn = document.createElement('div');
                btn.className = 'cap-btn-dinamico';
                btn.innerText = idCap;
                btn.onclick = () => abrirLector(idCap);
                grid.appendChild(btn);
            });
        } catch (e) { console.error(e); }
    }

    window.abrirLector = async function(idCap) {
        const lector = document.getElementById('lector');
        const contenedor = document.getElementById('contenido-imagenes');
        lector.style.display = 'block';
        contenedor.innerHTML = "Cargando...";
        try {
            const snap = await getDoc(doc(db, "leopardo", "capitulo_" + idCap));
            if (snap.exists()) {
                const data = snap.data();
                contenedor.innerHTML = "";
                let imgs = Array.isArray(data.imagenes) ? data.imagenes : [data.link];
                imgs.forEach(url => {
                    if (url) {
                        const img = document.createElement('img');
                        img.src = window.arreglarLink(url.trim());
                        contenedor.appendChild(img);
                    }
                });
            }
        } catch (e) { console.error(e); }
    }

    window.cerrarLector = () => { document.getElementById('lector').style.display = 'none'; };
    cargarProyectoDesdeFirebase();
</script>
</body>
</html>
