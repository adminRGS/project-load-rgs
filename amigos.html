<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Los amigos no hacen esto - Rose Garden Scan</title>
    <style>
        body { 
            margin: 0; padding: 0; 
            background: radial-gradient(circle at center, #1a0a1a 0%, #050505 100%); 
            color: white; font-family: 'serif'; 
            display: flex; flex-direction: column; align-items: center; 
            overflow-x: hidden; min-height: 100vh; 
        }
        
        body::after {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                radial-gradient(circle, #fff 1px, transparent 1px),
                radial-gradient(circle, #fff 1.5px, transparent 1.5px);
            background-size: 80px 80px, 150px 150px;
            background-position: 0 0, 75px 75px;
            opacity: 0.2;
            animation: moveStars 30s linear infinite;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes moveStars {
            from { transform: translateY(0); }
            to { transform: translateY(-150px); }
        }

        .contenedor-regreso { width: 100%; padding: 20px; display: flex; justify-content: flex-start; box-sizing: border-box; z-index: 10; }
        .btn-catalogo { 
            text-decoration: none; color: #ff66b2; 
            border: 2px solid #ff66b2; padding: 10px 22px; 
            border-radius: 30px; font-weight: bold; font-size: 0.95rem; 
            transition: 0.3s; display: flex; align-items: center; gap: 10px; 
            background: rgba(255, 102, 178, 0.1);
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 15px rgba(255, 102, 178, 0.2);
        }
        .btn-catalogo:hover { 
            background: #ff66b2; color: white; 
            box-shadow: 0 0 25px rgba(255, 102, 178, 0.8); 
            transform: scale(1.05);
        }

        header { padding: 15px; text-align: center; z-index: 10; }
        h1 { 
            font-size: 2.2rem; 
            background: linear-gradient(90deg, #ff66b2, #ffd700, #ff66b2); 
            background-size: 200% auto; -webkit-background-clip: text; 
            color: transparent; animation: shineText 4s linear infinite; margin: 10px 0; 
            text-shadow: 0 0 15px rgba(255, 102, 178, 0.3);
        }
        @keyframes shineText { to { background-position: 200% center; } }

        .grid-caps { 
            display: grid; grid-template-columns: repeat(4, 1fr); 
            gap: 15px; width: 92%; max-width: 500px; 
            padding-bottom: 60px; margin-top: 25px; z-index: 10;
        }
        .cap-btn { 
            background: rgba(255, 102, 178, 0.15); 
            border: 1px solid #ff66b2; 
            color: white; text-align: center; padding: 20px 0; 
            border-radius: 15px; font-weight: bold; transition: 0.4s ease; 
            cursor: pointer; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        .cap-btn:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 0 30px rgba(255, 102, 178, 0.8);
            background: rgba(255, 102, 178, 0.4);
            border-color: #ffd700;
        }

        #lector { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 100; overflow-y: scroll; scroll-behavior: smooth; }
        #contenido-imagenes img { width: 100%; display: block; margin-bottom: -1px; }
        
        /* BARRA DE NAVEGACIÓN ARMÓNICA */
        .nav-lector { 
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); 
            display: flex; align-items: center; gap: 8px; 
            background: rgba(0, 0, 0, 0.96); 
            padding: 6px 14px; border-radius: 40px; border: 1px solid #ff66b2; 
            backdrop-filter: blur(12px); z-index: 102; 
            box-shadow: 0 0 30px rgba(255, 102, 178, 0.4); 
            width: fit-content; max-width: 95vw;
        }
        .nav-btn { 
            background: #ff66b2; color: white; border: none; 
            padding: 8px 12px; border-radius: 20px; font-weight: bold; 
            cursor: pointer; transition: 0.2s; font-size: 0.8rem;
        }
        .nav-btn:active { transform: scale(0.9); }
        .nav-btn:disabled { background: #333; opacity: 0.4; cursor: not-allowed; }

        .btn-cerrar { background: #ff4d4d; width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; border: none; color: white; cursor: pointer; }

        /* CONTENEDOR DE REACCIONES INTEGRADO */
        .btn-reacciones-stats {
            position: relative;
            display: flex; align-items: center; gap: 8px;
            background: rgba(255, 102, 178, 0.15);
            border: 1px solid #ff66b2;
            padding: 6px 12px; border-radius: 25px;
            cursor: pointer; transition: 0.3s;
        }
        .btn-reacciones-stats:hover { background: rgba(255, 102, 178, 0.3); }
        
        .stat-item { display: flex; align-items: center; gap: 3px; font-size: 0.75rem; font-weight: bold; color: #ffcce6; }
        .pulgar-main { font-size: 1rem; filter: hue-rotate(300deg); margin-right: 2px; }

        /* MENÚ DE SELECCIÓN (FLOTANDO HACIA ARRIBA) */
        .menu-pop {
            display: none;
            position: absolute;
            bottom: 50px; left: 50%; transform: translateX(-50%);
            background: rgba(15, 15, 15, 0.98);
            border: 1px solid #ff66b2;
            padding: 10px 15px; border-radius: 30px;
            gap: 15px; z-index: 110;
            box-shadow: 0 0 20px rgba(255, 102, 178, 0.6);
        }
        .menu-pop.visible { display: flex; animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

        @keyframes popIn {
            from { opacity: 0; transform: translate(-50%, 15px) scale(0.8); }
            to { opacity: 1; transform: translate(-50%, 0) scale(1); }
        }

        .emoji-opt { font-size: 1.5rem; cursor: pointer; transition: 0.2s; }
        .emoji-opt:hover { transform: scale(1.4); }
    </style>
</head>
<body>

    <div class="contenedor-regreso">
        <a href="historias.html" class="btn-catalogo">🏠 Volver a Historias</a>
    </div>

    <header>
        <h1>Los amigos no hacen esto</h1>
    </header>

    <div id="lector">
        <div class="nav-lector">
            <button id="btn-ant" class="nav-btn" onclick="capAnterior()">←</button>
            <button id="btn-sig" class="nav-btn" onclick="capSiguiente()">→</button>
            <button class="btn-cerrar" onclick="cerrarLector()">✕</button>

            <div class="btn-reacciones-stats" onclick="toggleMenu(event)">
                <span class="pulgar-main">👍</span>
                <div class="stat-item">❤️ <span id="val-loves">0</span></div>
                <div class="stat-item">👍 <span id="val-likes">0</span></div>
                <div class="stat-item">😂 <span id="val-haha">0</span></div>

                <div class="menu-pop" id="menu-emojis">
                    <span class="emoji-opt" onclick="votar('loves', event)">❤️</span>
                    <span class="emoji-opt" onclick="votar('likes', event)">👍</span>
                    <span class="emoji-opt" onclick="votar('haha', event)">😂</span>
                </div>
            </div>
        </div>
        <div id="contenido-imagenes"></div>
    </div>

    <div class="grid-caps" id="grid"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, getDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBvTN_fjSZgGcEaraGeWSrnyUci_gsJ9cs",
        authDomain: "prgs-f2ef8.firebaseapp.com",
        projectId: "prgs-f2ef8",
        storageBucket: "prgs-f2ef8.firebasestorage.app",
        messagingSenderId: "639472415083",
        appId: "1:639472415083:web:2940245a8a70ed6c88dc2e"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const historiaID = "amigos"; 
    let capActual = 1;
    let listaCapitulos = [];

    function arreglarLink(url) {
        if (url.includes('drive.google.com')) {
            let id = url.includes('id=') ? url.split('id=')[1].split('&')[0] : url.split('/d/')[1].split('/')[0];
            return `https://lh3.googleusercontent.com/d/${id}`;
        }
        return url;
    }

    async function cargarCapitulos() {
        try {
            const querySnapshot = await getDocs(collection(db, historiaID));
            listaCapitulos = [];
            querySnapshot.forEach((doc) => {
                const numStr = doc.id.replace("capitulo_", "");
                listaCapitulos.push(parseFloat(numStr));
            });
            listaCapitulos.sort((a, b) => a - b);
            const grid = document.getElementById('grid');
            grid.innerHTML = ""; 
            listaCapitulos.forEach(num => {
                const btn = document.createElement('div');
                btn.innerText = num === 0 ? "0" : num; 
                btn.className = 'cap-btn';
                btn.onclick = () => abrirLector(num);
                grid.appendChild(btn);
            });
        } catch (e) { console.error(e); }
    }

    cargarCapitulos();

    window.abrirLector = async function(num) {
        capActual = num;
        const lector = document.getElementById('lector');
        const contenedor = document.getElementById('contenido-imagenes');
        lector.style.display = 'block'; 
        lector.scrollTop = 0;
        contenedor.innerHTML = "<p style='text-align:center; padding-top:100px; color:#ff66b2;'>✨ Abriendo páginas... ✨</p>";

        const indexActual = listaCapitulos.indexOf(num);
        document.getElementById('btn-ant').disabled = (indexActual <= 0);
        document.getElementById('btn-sig').disabled = (indexActual >= listaCapitulos.length - 1);

        try {
            const docRef = doc(db, historiaID, "capitulo_" + num);
            const docSnap = await getDoc(docRef);
            if (docSnap.exists()) {
                const data = docSnap.data();
                contenedor.innerHTML = "";
                
                // Cargar valores individuales
                document.getElementById('val-loves').innerText = data.loves || 0;
                document.getElementById('val-likes').innerText = data.likes || 0;
                document.getElementById('val-haha').innerText = data.haha || 0;

                let imgs = Array.isArray(data.imagenes) ? data.imagenes : (data.link ? [data.link] : []);
                imgs.forEach(url => {
                    if (url.trim().length > 5) {
                        const img = document.createElement('img');
                        img.src = arreglarLink(url.trim());
                        contenedor.appendChild(img);
                    }
                });
            }
        } catch (e) { console.error(e); }
    }

    window.toggleMenu = (e) => {
        e.stopPropagation();
        document.getElementById('menu-emojis').classList.toggle('visible');
    };

    window.votar = async (tipo, e) => {
        e.stopPropagation();
        const docRef = doc(db, historiaID, "capitulo_" + capActual);
        try {
            await updateDoc(docRef, { [tipo]: increment(1) });
            const el = document.getElementById('val-' + tipo);
            el.innerText = parseInt(el.innerText) + 1;
            document.getElementById('menu-emojis').classList.remove('visible');
        } catch (err) { console.log("Error al votar"); }
    };

    window.capAnterior = () => { 
        const indexActual = listaCapitulos.indexOf(capActual);
        if (indexActual > 0) abrirLector(listaCapitulos[indexActual - 1]);
    };

    window.capSiguiente = () => { 
        const indexActual = listaCapitulos.indexOf(capActual);
        if (indexActual < listaCapitulos.length - 1) abrirLector(listaCapitulos[indexActual + 1]);
    };

    window.cerrarLector = () => { document.getElementById('lector').style.display = 'none'; };

    document.addEventListener('click', () => {
        document.getElementById('menu-emojis').classList.remove('visible');
    });
</script>
</body>
</html>
