<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Rose Garden Scan</title>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>

        :root {
            color-scheme: light !important;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffeef4 !important;
            color: #4a1525 !important;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            color: #d81b60 !important;
            text-align: center;
            font-family: 'Georgia', serif;
            margin-bottom: 25px;
            font-size: 1.8rem;
        }

        #bloque-login {
            background: #ffffff !important;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(216, 27, 96, 0.15);
            border: 2px solid #f48fb1 !important;
            text-align: center;
            max-width: 340px;
            width: 100%;
            box-sizing: border-box;
            margin-top: 40px;
        }

        #contenido-panel {
            display: none;
            width: 100%;
            max-width: 500px;
            flex-direction: column;
            align-items: center;
        }

        .menu-administracion {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            margin-bottom: 30px;
        }

        .btn-menu {
            width: 100%;
            padding: 16px;
            background: #ffffff !important;
            border: 2px solid #f48fb1 !important;
            color: #d81b60 !important;
            border-radius: 14px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            box-sizing: border-box;
        }

        .btn-menu:hover,
        .btn-menu.activo {
            background: #f48fb1 !important;
            color: white !important;
            box-shadow: 0 5px 15px rgba(244, 139, 177, 0.4);
            transform: translateY(-2px);
        }

        .seccion-admin {
            display: none;
            width: 100%;
            background: #ffffff !important;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(216, 27, 96, 0.1);
            border: 2px solid #f48fb1 !important;
            box-sizing: border-box;
            margin-bottom: 30px;
        }

        .seccion-admin.activa {
            display: block;
        }

        .seccion-admin h2 {
            color: #d81b60 !important;
            margin-top: 0;
            font-size: 1.4rem;
            border-bottom: 2px dashed #fde4ec;
            padding-bottom: 10px;
        }

        .grupo-control {
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-weight: bold;
            color: #ad1457 !important;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input,
        select,
        textarea {
            padding: 14px;
            background: #fff5f8 !important;
            border: 2px solid #fbc4b6 !important;
            color: #4a1525 !important;
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
            width: 100%;
            box-sizing: border-box;
        }

        .btn-guardar {
            background: #ec407a !important;
            color: white !important;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            width: 100%;
        }

    </style>
</head>

<body>

    <h1>🌸 Panel de Control - Rose Garden Scan 🌸</h1>

    <div id="bloque-login">

        <h2 style="color:#d81b60;">🌸 Acceso Administrativo</h2>

        <div class="grupo-control">
            <label>Contraseña</label>
            <input type="password" id="clave-input">
        </div>

        <button class="btn-guardar" onclick="verificarClave()">
            Entrar
        </button>

    </div>

    <div id="contenido-panel">

        <div class="menu-administracion">

            <button class="btn-menu"
                onclick="abrirSeccion(event,'opcion-cargar')">
                📂 Cargar Capítulo
            </button>

            <button class="btn-menu"
                onclick="abrirSeccion(event,'opcion-estatus')">
                🔄 Actualizar Estatus
            </button>

            <button class="btn-menu"
                onclick="abrirSeccion(event,'opcion-nuevo')">
                ✨ Crear / Editar Proyecto
            </button>

        </div>

        <!-- CARGAR -->
        <div id="opcion-cargar" class="seccion-admin">

            <h2>📂 Cargar Capítulo</h2>

            <div class="grupo-control">
                <label>Proyecto</label>

                <select id="select-proyecto-capitulo"></select>
            </div>

            <div class="grupo-control">
                <label>Número Capítulo</label>

                <input type="number" id="num-capitulo">
            </div>

            <div class="grupo-control">
                <label>Imágenes</label>

                <textarea id="enlaces-imagenes" rows="8"></textarea>
            </div>

            <button class="btn-guardar" onclick="subirCapitulo()">
                Publicar Capítulo
            </button>

        </div>

        <!-- ESTATUS -->
        <div id="opcion-estatus" class="seccion-admin">

            <h2>🔄 Actualizar Estatus</h2>

            <div class="grupo-control">
                <label>Proyecto</label>

                <select id="select-proyecto-estatus"></select>
            </div>

            <div class="grupo-control">
                <label>Nuevo Estatus</label>

                <select id="nuevo-estado-valor">
                    <option value="emision">🔴 En Emisión</option>
                    <option value="hiatus">🟡 En Hiatus</option>
                    <option value="finalizado">💖 Finalizado</option>
                </select>
            </div>

            <button class="btn-guardar"
                onclick="actualizarEstadoFirebase()">
                Actualizar Estado
            </button>

        </div>

        <!-- EDITAR -->
        <div id="opcion-nuevo" class="seccion-admin">

            <h2>✨ Crear / Editar Proyecto</h2>

            <div class="grupo-control">
                <label>ID</label>
                <input type="text" id="nuevo-id">
            </div>

            <div class="grupo-control">
                <label>Nombre</label>
                <input type="text" id="nuevo-titulo">
            </div>

            <div class="grupo-control">
                <label>Portada</label>
                <input type="text" id="nuevo-portada">
            </div>

            <div class="grupo-control">
                <label>Sinopsis</label>
                <textarea id="nuevo-sinopsis"></textarea>
            </div>

            <button class="btn-guardar"
                onclick="crearNuevoProyecto()">
                Guardar Proyecto
            </button>

            <hr>

            <div class="grupo-control">
                <label>Editar Proyecto</label>

                <select id="select-proyecto-editar"></select>
            </div>

            <div class="grupo-control">
                <label>Editar Portada</label>
                <input type="text" id="editar-portada">
            </div>

            <div class="grupo-control">
                <label>Editar Sinopsis</label>
                <textarea id="editar-sinopsis"></textarea>
            </div>

            <button class="btn-guardar"
                onclick="guardarEdicionProyecto()">
                Guardar Cambios
            </button>

        </div>

    </div>

    <script>
        // FIREBASE
const firebaseConfig = {
    apiKey: "AIzaSyBvTN_fjSZgGcEaraGeWSrnyUci_gsJ9cs",
    authDomain: "prgs-f2ef8.firebaseapp.com",
    projectId: "prgs-f2ef8",
    storageBucket: "prgs-f2ef8.firebasestorage.app",
    messagingSenderId: "639472415083",
    appId: "1:639472415083:web:2940245a8a70ed6c88dc2e",
    measurementId: "G-Z2PMBL3X8V"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// LOGIN
function verificarClave() {

    const clave = document.getElementById("clave-input").value;

    if (clave === "Rose2026") {

        document.getElementById("bloque-login").style.display = "none";
        document.getElementById("contenido-panel").style.display = "flex";

    } else {

        alert("Contraseña incorrecta");
    }
}

// SECCIONES
function abrirSeccion(event, id) {

    document.querySelectorAll('.seccion-admin').forEach(sec => {
        sec.classList.remove('activa');
    });

    document.getElementById(id).classList.add('activa');
}

// BLINDAR DRIVE
function blindarEnlaceDrive(link) {
function blindarEnlaceDrive(link) {

    if (!link) return "";

    // SI YA ES LH3 NO MODIFICAR
    if (
        link.includes("lh3.googleusercontent.com") ||
        link.includes("googleusercontent.com")
    ) {
        return link;
    }

    // CONVERTIR LINKS DE DRIVE
    const match = link.match(/\/d\/(.*?)\//);

    if (match && match[1]) {

        return `https://drive.google.com/uc?export=view&id=${match[1]}`;
    }

    // SI NO ES DRIVE NI LH3 DEVOLVER NORMAL
    return link;
}
// PROYECTOS
const proyectos = [

    {
        id: "leopardo",
        nombre: "La pequeña bebé leopardo de las nieves de la familia panteras negras"
    },

    {
        id: "amigos",
        nombre: "Los amigos no hacen esto"
    },

    {
        id: "hermana",
        nombre: "Mi hermana que era mi enemiga ahora me ama"
    },

    {
        id: "salvada",
        nombre: "Salvada por la pequeña dama sin poderes"
    },

    {
        id: "confesion",
        nombre: "Confesión"
    },

    {
        id: "embarazada",
        nombre: "Fingí estar embarazada pero mi marido regresó"
    },

    {
        id: "lobo",
        nombre: "Soy un lobo pero no le lastimaré"
    },

    {
        id: "matrimonio",
        nombre: "Matrimonio de conveniencia a una obsesión"
    },

    {
        id: "guarderia",
        nombre: "La guardería de la villana"
    },

    {
        id: "princesa",
        nombre: "No solo encante a la princesa!"
    }
];

// CARGAR SELECTS
function cargarProyectosEnSelects() {

    const selects = [
        document.getElementById("select-proyecto-capitulo"),
        document.getElementById("select-proyecto-estatus"),
        document.getElementById("select-proyecto-editar")
    ];

    selects.forEach(select => {

        select.innerHTML = "";

        proyectos.forEach(proyecto => {

            const option = document.createElement("option");

            option.value = proyecto.id;
            option.textContent = proyecto.nombre;

            select.appendChild(option);
        });
    });
}

// SUBIR CAPÍTULO
function subirCapitulo() {

    const proyecto =
        document.getElementById("select-proyecto-capitulo").value;

    const numero =
        document.getElementById("num-capitulo").value;

    const enlaces = document.getElementById("enlaces-imagenes")
        .value
        .split("\n")
        .filter(link => link.trim() !== "")
        .map(link => blindarEnlaceDrive(link.trim()));

    if (!proyecto || !numero || enlaces.length === 0) {

        alert("Completa todos los campos.");
        return;
    }

    db.collection(proyecto)
        .doc("capitulo_" + numero)
        .set({
            numero: numero,
            imagenes: enlaces,
            fecha: new Date()
        })

        .then(() => {

            alert("¡Capítulo publicado!");

            document.getElementById("num-capitulo").value = "";
            document.getElementById("enlaces-imagenes").value = "";
            document.getElementById("select-proyecto-capitulo").value = "";
        })

        .catch(error => alert("Error: " + error));
}

// ESTATUS
function actualizarEstadoFirebase() {

    const idSubido =
        document.getElementById("select-proyecto-estatus").value;

    const nuevoEstado =
        document.getElementById("nuevo-estado-valor").value;

    db.collection("estados_historias")
        .doc(idSubido)
        .set({
            estado: nuevoEstado
        }, { merge: true })

        .then(() => alert("¡Estatus actualizado!"))

        .catch(error => alert(error));
}

// CREAR
function crearNuevoProyecto() {

    const id =
        document.getElementById("nuevo-id").value.trim();

    const titulo =
        document.getElementById("nuevo-titulo").value.trim();

    const portadaRaw =
        document.getElementById("nuevo-portada").value.trim();

    const sinopsis =
        document.getElementById("nuevo-sinopsis").value.trim();

    const portada = blindarEnlaceDrive(portadaRaw);

    db.collection(id)
        .doc("datos_proyecto")
        .set({
            nombre: titulo,
            portadaUrl: portada,
            sinopsis: sinopsis
        }, { merge: true })

        .then(() =>
            db.collection("estados_historias")
                .doc(id)
                .set({
                    estado: "emision"
                }, { merge: true })
        )

        .then(() => {

            alert("¡Proyecto creado!");

            document.getElementById("nuevo-id").value = "";
            document.getElementById("nuevo-titulo").value = "";
            document.getElementById("nuevo-portada").value = "";
            document.getElementById("nuevo-sinopsis").value = "";
        });
}

// EDITAR
function guardarEdicionProyecto() {

    const id =
        document.getElementById("select-proyecto-editar").value;

    const portada =
        blindarEnlaceDrive(
            document.getElementById("editar-portada").value.trim()
        );

    const sinopsis =
        document.getElementById("editar-sinopsis").value.trim();

    db.collection(id)
        .doc("datos_proyecto")
        .set({
            portadaUrl: portada,
            sinopsis: sinopsis
        }, { merge: true })

        .then(() => alert("¡Cambios guardados!"));
}

// INICIO
window.onload = function () {

    cargarProyectosEnSelects();
};

</script>
</body>
</html>
